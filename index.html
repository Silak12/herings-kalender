<style>
/*
VOICE: gemütlich-gruseliger Familienkrimi, warm, zum Vorlesen am Adventsabend
IDEA: die Fassade von Herings Gaststätte bei Nacht, jedes Fenster ein Türchen; jedes Kapitel ist eine Ermittlungsakte
PICTURE: SVG-Hausfassade mit Schild, verschneitem Dach, Kellerbrunnen-Licht; auf Kapitelseiten der Giebel mit großer Türchen-Nummer
COLOUR and TYPE: Tannennacht #10201c als Grund in beiden Themen, Lampengold #f0c45a, Puderzuckerweiß, Stempelrot #d2453a; Fraktur nur fürs Schild, Literata zum Lesen, Alegreya Sans für Etiketten
LAYOUT: Start = Fassade + 6×4-Fenstergitter; Kapitel = Giebel-Kopf, eine ruhige Lesespalte, Ermittlerfrage als roter Aktenstempel, Navigation unten
*/
:root{color-scheme:dark;--bg:#10201c;--bg2:#17302a;--ink:#f3eee2;--soft:#bfc9bf;--gold:#f0c45a;--red:#d2453a;--line:#2b4a42;--fs:18px}
:root[data-theme=light],:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:20px}
body{margin:0;background:var(--bg);color:var(--ink);font:var(--fs)/1.7 Literata,Georgia,serif;overflow-x:clip;-webkit-text-size-adjust:100%}
a{color:var(--gold)}
button{font:inherit}
.band{padding:clamp(20px,4vw,48px) max(5vw,16px)}
.wrap{max-width:720px;margin:0 auto}
.sign{font-family:UnifrakturMaguntia,serif}
.lbl{font-family:"Alegreya Sans",system-ui,sans-serif;font-weight:800;letter-spacing:.02em}
#snow{position:fixed;inset:0;pointer-events:none;z-index:0}
main{position:relative;z-index:1}
/* Start */
.hero{text-align:center;padding-bottom:0}
.hero h1{font:400 clamp(38px,8vw,64px)/1.05 UnifrakturMaguntia,serif;margin:0 0 6px;color:var(--gold);text-wrap:balance}
.hero p{margin:0 auto;max-width:34em;color:var(--soft);font-size:17px}
.house{display:block;width:100%;max-width:640px;height:auto;margin:18px auto 0}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;max-width:640px;margin:0 auto}
@media(min-width:620px){.grid{grid-template-columns:repeat(6,minmax(0,1fr))}}
.win{position:relative;aspect-ratio:3/4;border-radius:10px 10px 4px 4px;border:2px solid #5a3b25;background:#2a1d14;display:flex;align-items:center;justify-content:center;text-decoration:none;color:#3b2a1d;font:800 clamp(22px,5vw,30px)/1 "Alegreya Sans",sans-serif;box-shadow:inset 0 0 0 4px #1e140d;overflow:hidden;min-height:44px}
.win::before,.win::after{content:"";position:absolute;background:#5a3b25}
.win::before{left:50%;top:0;bottom:0;width:3px;transform:translateX(-50%)}
.win::after{top:46%;left:0;right:0;height:3px}
.win span{position:relative;z-index:1;background:var(--bg);border-radius:50%;width:1.7em;height:1.7em;display:flex;align-items:center;justify-content:center;color:var(--soft)}
.win.open{background:radial-gradient(circle at 50% 40%,#ffe6a0,#f0c45a 55%,#c98a2c);border-color:#7a4f2c}
.win.open span{background:#fff6dc;color:#5a3b25}
.win.seen span::after{content:"✓";position:absolute;right:-6px;bottom:-6px;font-size:13px;background:var(--red);color:#fff;border-radius:50%;width:18px;height:18px;display:flex;align-items:center;justify-content:center}
.win.today{outline:3px solid var(--red);outline-offset:3px}
.win:focus-visible,.btn:focus-visible{outline:3px solid #fff;outline-offset:3px}
.foot{text-align:center;color:var(--soft);font-size:14px;padding-top:28px}
/* Kapitel */
.gable{text-align:center;padding-bottom:8px}
.gable svg{width:min(420px,100%);height:auto;display:block;margin:0 auto}
.kicker{color:var(--gold);font-size:15px;margin:10px 0 2px}
.chap h2{font:600 clamp(30px,6vw,44px)/1.1 Literata,serif;margin:0 0 4px;text-wrap:balance}
.meta{color:var(--soft);font-size:14px}
.text p{margin:0 0 1em;hyphens:auto}
.text p:first-of-type::first-letter{font:400 3.4em/0.8 UnifrakturMaguntia,serif;float:left;padding:.08em .08em 0 0;color:var(--gold)}
.verse{border-left:3px solid var(--gold);padding:.3em 0 .3em 1em;font-style:italic;white-space:pre-line;margin:0 0 1em}
.q{position:relative;margin:2em 0 1em;padding:22px 20px 18px;border:2px dashed var(--red);border-radius:6px;background:rgba(210,69,58,.08)}
.q b{position:absolute;top:-.85em;left:14px;background:var(--bg);padding:0 8px;color:var(--red);font-size:15px}
.q p{margin:0}
.nav{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;margin-top:24px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 18px;border-radius:999px;border:2px solid var(--line);background:var(--bg2);color:var(--ink);text-decoration:none;cursor:pointer;font:800 16px/1 "Alegreya Sans",sans-serif}
.btn.gold{background:var(--gold);color:#2a1d14;border-color:var(--gold)}
.tools{display:flex;gap:8px;justify-content:center;margin-top:12px}
.tools .btn{min-height:44px;padding:0 14px;font-size:15px}
/* gesperrt */
.lock{text-align:center;padding-top:10px}
.lock .big{font:400 clamp(44px,10vw,72px)/1 UnifrakturMaguntia,serif;color:var(--gold);margin:8px 0}
.lock p{color:var(--soft);max-width:28em;margin:0 auto 1em}
@media(max-width:600px){:root{--fs:17px}}
@media(prefers-reduced-motion:reduce){#snow{display:none}}
</style>

<script>
{
const K = [{"n": 1, "t": "Der Stollen ruht", "p": ["In Taura, einem kleinen Ort in Sachsen, steht ein Haus, auf dem noch immer in großen Buchstaben „Herings Gaststätte“ steht. Gezapft wird hier schon lange nicht mehr. Aber wer genau hinhört, meint manchmal noch das Klappern der Kegel, das Lachen am Stammtisch und die ruhige Stimme von Ulli Hering, der hinter dem Tresen stand und gleichzeitig Wirt und Polizist war. Ein Mann, der ein Bier zapfen und dabei einen Fall lösen konnte, ohne dass der Schaum überlief.", "Heute wohnen hier Uwe und Susanne, und oben drüber, in ihrer eigenen kleinen Wohnung, Oma Rosita. Dazu zwei Katzen: Bonnie, rund, gemütlich und so still, dass man manchmal vergaß, dass sie überhaupt da war. Und ihr Sohn Rocky, der das genaue Gegenteil war. Rocky miaute morgens, Rocky miaute mittags, Rocky miaute, wenn man ihn ansah, und Rocky miaute, wenn man ihn nicht ansah, weil man ihn nicht ansah.", "Es war der letzte Novembertag, und im ganzen Haus roch es nach Butter, Rosinen und Zitronat. Oma Rosita hatte ihren Stollen gebacken. Wie jedes Jahr. Und wie jedes Jahr sagte sie dabei: „Dieses Jahr wird er nichts. Der Teig war komisch. Und mein Knie tut weh.“", "„Mutti, der Stollen ist jedes Jahr perfekt“, sagte Susanne, die bereits zum dritten Mal an diesem Vormittag den Flur gesaugt hatte. Staubsaugen war für Susanne keine Hausarbeit. Es war Meditation.", "Auf Omas Handy, das an der Zuckerdose lehnte, klingelte ein Videoanruf. Rosita brauchte drei Versuche, um ihn anzunehmen, dann erschien ein Gesicht. „Hallo aus Berlin!“, rief Elaine. „Ist der Stollen fertig? Zeigt mal!“", "Uwe trat ins Bild. Er trug einen dunkelblauen Kaschmirpullover von Boss und eine messerscharf gebügelte Hose, sah also aus wie James Bond an seinem freien Tag, und beugte sich so tief über den Stollen, dass seine Nase fast im Puderzucker landete.", "„Uwe“, sagte Rosita scharf. „Finger weg.“", "„Ich rieche nur“, sagte Uwe. „Riechen ist kein Essen. Das ist ein wissenschaftlich anerkannter Unterschied.“", "„Ich bin Zeugin“, sagte Elaine vom Handy. „Er hat ihn nicht angefasst. Noch nicht.“", "Ein Stollen muss ruhen. Das weiß in Sachsen jedes Kind. Mindestens drei Wochen, kühl und dunkel, damit sich die Aromen verbinden. Und der kühlste, dunkelste Ort im ganzen Haus war der Keller.", "Der Keller von Herings Gaststätte war kein Ort, an den man gern ging. Eine steile Treppe führte hinab, die Wände waren feucht und kalt, und in der hintersten Ecke stand der alte Brunnen, mit einem schweren Holzdeckel verschlossen. Niemand wusste genau, wie tief er war. Wenn man einen Stein hineinwarf, dauerte es unangenehm lange, bis man ihn aufschlagen hörte.", "Oma Rosita ging grundsätzlich nicht in den Keller. In den Garten ging Oma Rosita noch, manchmal sogar bis auf die Holzterrasse, die Uwe gebaut hatte. Aber weiter als bis zum Gartenzaun ging sie nicht. Und die Kellertreppe hinunter schon gar nicht. „Da unten holt man sich den Tod“, sagte sie. „Und außerdem ist da unten nichts für mich.“", "Also trug Uwe den Stollen hinunter. Eingewickelt in ein sauberes Küchentuch, legte er ihn feierlich auf das alte Holzregal neben dem Brunnen. Er rückte ihn zweimal zurecht, bis er exakt parallel zur Regalkante lag. Uwe war Perfektionist. Auch bei Stollen.", "„Am vierundzwanzigsten“, flüsterte er dem Stollen zu, „sehen wir uns wieder.“", "Als er die Treppe wieder hinaufstieg, saß Bonnie auf der obersten Stufe und sah ihn an. Sie sagte nichts. Bonnie sagte nie etwas. Rocky dagegen schoss zwischen seinen Beinen hindurch, schrie dreimal empört und verschwand im Flur.", "In dieser Nacht schlief das ganze Haus tief und fest. Fast das ganze Haus.", "Denn gegen drei Uhr morgens, als der Mond über Taura stand, drang aus der Tiefe des Hauses ein Geräusch. Ein langgezogenes, hohles, schauriges Heulen. Es klang, als käme es von sehr, sehr weit unten.", "So, als käme es aus einem Brunnen."], "q": "Was glaubt ihr: Wie lange überlebt ein Stollen in diesem Haus?"}, {"n": 2, "t": "Der Fall Stollen", "p": ["Am nächsten Morgen saß Oma Rosita schon um sieben Uhr am Telefon. Sie rief nicht etwa an, um einen guten Morgen zu wünschen. Sie rief an, um mitzuteilen, dass sie kein Auge zugetan hatte.", "„Da war was“, sagte sie. „Da unten. Ein Heulen. Ich habe es genau gehört. Ich habe immer gesagt, in diesem Keller ist was nicht in Ordnung.“", "„Mutti, das war bestimmt der Wind“, sagte Susanne.", "„Der Wind heult nicht im Keller. Der Wind heult draußen. Geh nachgucken. Und guck nach meinem Stollen.“", "Da Rosita, wie gesagt, nicht in den Keller ging, hatte sie einen genauen Plan aufgestellt: Jeden Morgen sollte jemand nach dem Stollen sehen und Bericht erstatten. Der Stollen war schließlich ihr Werk, ihr Stolz und, wie sie gern betonte, „das Einzige, worauf man sich in diesem Haus noch verlassen kann“.", "Susanne nahm die Taschenlampe, stieg die steile Treppe hinab und tastete nach dem Lichtschalter. Die nackte Glühbirne flackerte zweimal und ging dann an. Der Brunnen stand da wie immer, schwer und still unter seinem Holzdeckel. Und auf dem Regal daneben lag der Stollen.", "Oder besser gesagt: Es lag dort, was vom Stollen übrig war.", "Das Küchentuch war zur Seite geschoben und an einem Zipfel zerknautscht, als hätte jemand daran gezerrt. Und der Kanten, das wunderbare, buttrige Endstück, war verschwunden. Auf dem Regal und auf dem Boden davor lag Puderzucker. Viel Puderzucker.", "Susanne stieg langsam wieder nach oben. Sie war eine fröhliche Frau, die eigentlich immer einen Witz auf den Lippen hatte. Aber jetzt wusste sie: Das hier würde nicht lustig werden.", "„Der Kanten ist weg“, sagte sie am Telefon.", "Es war sehr lange still in der Leitung.", "„Ich habe es gewusst“, sagte Rosita schließlich mit dunkler Stimme. „Einem bleibt aber auch gar nichts. Drei Tage stehe ich in der Küche, und dann so was. Das ist das Ende. Weihnachten fällt aus.“", "Eine halbe Stunde später versammelte sich die Familie in der alten Gaststube, die heute Wohnzimmer und Partyraum zugleich war. Das Handy stand auf dem Stammtisch, Elaine war aus Berlin zugeschaltet. Und alle Blicke richteten sich auf Uwe.", "Uwe saß am Tresen. Er trug einen eleganten hellgrauen Rollkragenpullover. Und auf diesem eleganten hellgrauen Rollkragenpullover, genau auf Brusthöhe, klebten Krümel.", "„Papa“, sagte Elaine vorsichtig. „Du hast da was.“", "Uwe sah an sich hinunter. „Das“, sagte er würdevoll, „ist Lebkuchen.“", "„Lebkuchen“, wiederholte Susanne.", "„Lebkuchen. Elisenlebkuchen, um genau zu sein. Völlig andere Krümelstruktur. Lebkuchen krümelt grob und dunkel, Stollen krümelt fein und hell, wegen des hohen Butteranteils und des Puderzuckers. Das ist im Grunde Allgemeinwissen.“", "„Du hast um sieben Uhr morgens Lebkuchen gegessen?“", "„Es ist Dezember“, sagte Uwe, als würde das alles erklären. Und ehrlich gesagt: Für Uwe erklärte es das auch.", "Oma Rosita war, ganz gegen ihre Gewohnheit, selbst heruntergekommen. Sie hatte dafür ihre Wohnung verlassen, sich am Treppengeländer festgehalten und ungefähr sieben Minuten für die Treppe gebraucht. Ein deutliches Zeichen dafür, wie ernst die Lage war.", "„Ich sage nur so viel“, sagte sie und sah Uwe lange an. „Es gibt in diesem Haus nur einen Menschen, der beim Wort Stollen feuchte Augen bekommt.“", "„Das ist Rührung“, protestierte Uwe. „Weil er so schön ist!“", "„Moment, Moment, Moment“, sagte Elaine. Sie hatte die Stimme aufgesetzt, mit der sie in dieser Familie seit dreißig Jahren Streit schlichtete. Elaine war die Schiedsrichterin. Wenn Uwe und Susanne sich über die richtige Art stritten, eine Spülmaschine einzuräumen, rief man Elaine an. Wenn Oma beleidigt war, weil niemand ihre Topflappen gelobt hatte, rief man Elaine an. „Niemand wird hier ohne Beweise verurteilt. Krümel auf einem Pullover sind ein Indiz, aber kein Beweis.“", "„Danke“, sagte Uwe.", "„Trotzdem bist du verdächtig, Papa.“", "„Undank“, sagte Uwe.", "In diesem Moment kam Rocky in die Gaststube gerannt, sprang auf den Stammtisch, warf dabei fast das Handy um, miaute dem verblüfften Gesicht von Elaine direkt ins Mikrofon und raste wieder davon.", "Bonnie lag die ganze Zeit auf dem Sofa in der Ecke und schlief. Jedenfalls sah es so aus."], "q": "Die Krümel auf Uwes Pullover: Beweis oder Zufall? Und was ist mit dem Puderzucker auf dem Kellerboden?"}, {"n": 3, "t": "Die Schiedsrichterin übernimmt", "p": ["Elaine saß in ihrer Wohnung in Berlin, vor sich einen Becher Tee und einen leeren Notizblock. Draußen rumpelte die S-Bahn vorbei. Sie war fast dreihundert Kilometer von Taura entfernt, aber sie spürte deutlich: Ihre Familie brauchte sie. Und zwar nicht als Schiedsrichterin. Sondern als Ermittlerin.", "Am Abend rief sie an. Susanne nahm ab, im Hintergrund lief der Fernseher, und irgendwo miaute Rocky.", "„Mama, ich übernehme den Fall“, sagte Elaine.", "„Welchen Fall?“", "„Den Stollen-Fall. Opa war Polizist. Irgendjemand in dieser Familie muss das ja ordentlich machen.“", "Susanne lachte, aber Elaine merkte, dass sie sich freute. „Und was soll ich tun?“", "„Du bist mein Außendienst. Du bist vor Ort, du kennst jeden Winkel im Haus, und du kennst die Geschichten von Taura besser als jeder andere. Ich brauche dich.“", "Susanne richtete sich etwas auf. Wenn man Susanne brauchte, war sie zur Stelle. Sie war die fleißigste Frau in ganz Sachsen, vermutlich sogar in ganz Deutschland. Sie konnte einen Garten umgraben, einen Kuchen backen, drei Geschenke einpacken und dabei noch den Flur saugen. Gleichzeitig.", "„Gut“, sagte sie. „Wo fangen wir an?“", "„Bei den Verdächtigen. Und bei den Alibis. Wo war Papa letzte Nacht?“", "Uwe wurde ans Telefon geholt. Er räusperte sich, als stünde er vor Gericht.", "„Ich war in der Gaststube“, sagte er. „Bis zwei Uhr nachts. Ich habe den Adventskranz gebunden.“", "„Bis zwei Uhr nachts?“", "„Die Schleife war schief.“", "„Wie oft hast du die Schleife neu gebunden?“", "Uwe zögerte. „Ungefähr vierzig Mal. Sie war beim neununddreißigsten Mal fast perfekt. Aber eben nur fast.“", "Elaine kannte ihren Vater. Das war glaubwürdig. Uwe war in der Lage, aus einem Stück Holz eine Terrasse zu bauen, aus Draht eine Lampe und aus alten Fensterrahmen ein Gewächshaus. Er war kreativ, er war geschickt, und er hörte erst auf, wenn alles wirklich stimmte. Bei Adventskränzen konnte das lange dauern.", "„Kann das jemand bezeugen?“", "„Der Kranz“, sagte Uwe.", "„Der Kranz zählt nicht als Zeuge.“", "„Er ist sehr schön geworden.“", "„Mama, hast du Papa gesehen?“", "„Ich habe geschlafen“, sagte Susanne. „Aber ich habe gehört, wie er geflucht hat. So gegen eins. Da war die Schleife wohl wieder schief.“", "Elaine notierte: Uwe – Alibi wackelig, aber plausibel. Krümel: Lebkuchen? Prüfen.", "„Was ist mit Oma?“", "„Oma war in ihrer Wohnung“, sagte Susanne. „Oma ist immer in ihrer Wohnung.“", "„Und die Katzen?“", "Susanne überlegte. „Rocky war überall. Rocky ist nachts immer überall. Er ist die Treppe rauf und runter gerannt wie ein Verrückter. Und Bonnie hat auf dem Sofa geschlafen, wie immer. Die hat sich doch seit Tagen kaum bewegt.“", "„Also ist Rocky verdächtig.“", "„Rocky ist immer verdächtig“, sagte Uwe. „Rocky hat schon mal eine ganze Bockwurst vom Teller gezogen, während ich sie angeschaut habe. Er hat mir dabei in die Augen gesehen.“", "Elaine schrieb die Liste der Verdächtigen auf. Sie war kurz, aber sie war ein Anfang.", "1. Uwe (Motiv: Liebe zum Stollen. Alibi: ein Adventskranz.)\n2. Rocky (Motiv: Rocky braucht kein Motiv. Alibi: keins.)\n3. Unbekannt (Wer heult nachts im Keller?)", "„Und Oma?“, fragte Susanne leise. „Schreibst du Oma auch drauf?“", "„Mama! Oma hat den Stollen gebacken. Warum sollte sie ihn selbst anknabbern?“", "„Man weiß nie“, sagte Susanne. „Vielleicht, um zu beweisen, dass einem nichts bleibt.“", "Elaine musste lachen. Aber dann schrieb sie trotzdem, ganz klein, an den Rand: 4. Oma?", "Bevor sie auflegte, sagte sie noch: „Ach, und Mama? Ab sofort schreibst du alles auf, was im Haus komisch ist. Jedes Geräusch, jedes verschwundene Ding, jeden Krümel. Und ihr fasst nichts im Keller an. Das ist jetzt ein Tatort.“", "„Darf ich wenigstens saugen?“", "„Den Tatort? Auf keinen Fall.“", "Es war, als hätte man Susanne gesagt, sie dürfe nicht mehr atmen. Aber sie nickte tapfer.", "Als Elaine an diesem Abend ins Bett ging, dachte sie noch lange an den alten Brunnen im Keller. Sie war als Kind nur ein einziges Mal unten gewesen, an der Hand von Opa Ulli. Er hatte gesagt: „Der Brunnen ist älter als wir alle. Der hat schon viel gesehen. Und er kann schweigen.“", "Damals hatte sie nicht verstanden, was er meinte. Jetzt fragte sie sich, ob er es selbst gewusst hatte."], "q": "Wen würdet ihr auf die Liste der Verdächtigen setzen? Fehlt da jemand?"}, {"n": 4, "t": "Geräusche aus der Tiefe", "p": ["Es war wieder drei Uhr morgens, als bei Uwe und Susanne das Haustelefon klingelte. Uwe fiel vor Schreck fast aus dem Bett. Susanne war schneller.", "„Da ist es wieder!“, flüsterte Oma Rosita durch den Hörer. Sie flüsterte so laut, dass man es vermutlich noch in Burgstädt hören konnte. „Hörst du es? Hör hin!“", "Susanne hielt den Atem an. Und tatsächlich: Aus der Tiefe des Hauses drang ein Laut zu ihnen herauf. Lang. Hohl. Klagend. Ein Heulen, das irgendwie nach Katze klang und irgendwie auch nicht. Es hallte und verhallte, als wäre es in einer Röhre gefangen.", "„Das ist ein Geist“, flüsterte Rosita. „Das ist ganz sicher ein Geist. Oder ein Einbrecher. Oder ein Einbrecher, der ein Geist ist. Ich habe immer gesagt, in diesem Haus passiert noch mal was.“", "„Ich gehe nachsehen“, sagte Uwe.", "Er sagte es mutig. Er stand auch mutig auf. Und dann tat er etwas, das nur Uwe in so einer Situation tun würde: Er zog sich ordentlich an. Er wählte den schwarzen Rollkragenpullover von Hilfiger, eine dunkle Stoffhose und seine polierten Lederschuhe. Er kämmte sich kurz die Haare.", "„Uwe, da unten ist vielleicht ein Einbrecher, und du machst dich schick?“", "„Wenn ich einem Einbrecher gegenübertrete“, sagte Uwe, „dann nicht im Schlafanzug. Hast du James Bond schon mal im Schlafanzug gesehen?“", "Susanne nahm die Taschenlampe, Uwe nahm einen alten Holzkochlöffel aus der Betriebsküche, den er wie einen Schlagstock hielt. So stiegen sie die Kellertreppe hinab.", "Der Keller war nachts noch unheimlicher als am Tag. Die Glühbirne warf lange, zitternde Schatten. Es roch nach feuchtem Stein und altem Holz und, ganz schwach, nach Butter und Zitronat. Die Kellertür am Fuß der Treppe stand einen Spaltbreit offen. Sie klemmte, solange irgendjemand denken konnte. Opa Ulli hatte immer gesagt, er würde sie nächstes Jahr richten. Das hatte er ungefähr dreißig Jahre lang gesagt.", "„Hallo?“, rief Susanne. „Ist da jemand?“", "„…jemand … jemand … mand“, antwortete der Keller.", "Uwe räusperte sich. „Wir sind bewaffnet!“", "„…waffnet … waffnet …“", "Sie leuchteten in jede Ecke. Da waren die alten Bierkisten aus Gaststättenzeiten, gestapelt bis unter die Decke. Da waren Uwes Werkzeugkisten, alphabetisch sortiert. Da war das alte Holzregal mit dem angeknabberten Stollen. Und da war der Brunnen, mit seinem schweren Deckel, der ein kleines bisschen schief lag.", "„Lag der vorher auch schief?“, flüsterte Susanne.", "„Keine Ahnung“, flüsterte Uwe zurück. „Aber jetzt, wo du es sagst, macht es mich wahnsinnig.“", "Er trat näher und schob den Deckel mit zwei Fingern gerade. Es kratzte laut über den Stein. Dann beugte er sich darüber und lauschte.", "Nichts. Nur Stille und, ganz tief unten, ein leises Tropfen.", "„Da ist niemand“, sagte er. „Kein Geist. Kein Einbrecher. Nur ein Brunnen, ein Stollen und eine Tür, die nicht schließt.“", "Susanne leuchtete noch einmal auf das Regal. Der Stollen sah unverändert aus. Zumindest war nichts Neues abgebissen. Aber auf dem Boden davor, im Puderzucker, glaubte sie etwas zu erkennen. Kleine, runde Abdrücke. Sie wollte sich gerade hinknien, um genauer hinzusehen …", "… als etwas mit lautem Gebrüll aus der Dunkelheit hinter den Bierkisten schoss, zwischen Uwes Beinen hindurchraste, die Treppe hinaufjagte und dabei so laut miaute, dass beide aufschrien.", "Uwe ließ den Kochlöffel fallen. Susanne ließ die Taschenlampe fallen. Die Taschenlampe rollte unter das Regal, und für einen Moment war es fast völlig dunkel.", "„Rocky“, sagte Susanne, als ihr Herz wieder einigermaßen normal schlug. „Das war Rocky.“", "„Natürlich war das Rocky“, sagte Uwe und hob mit zittriger Hand den Kochlöffel auf. „Ich wusste das. Ich habe nur so getan, als ob ich mich erschrecke. Aus taktischen Gründen.“", "Als sie wieder oben waren, rief Susanne bei Oma an. „Es war Rocky, Mutti. Nur Rocky.“", "„Rocky heult nicht so“, sagte Rosita. „Rocky schreit. Das ist ein Unterschied. Was ich gehört habe, war kein Schreien. Das war ein Heulen. Wie aus einem Grab.“", "Susanne wollte widersprechen. Aber sie musste zugeben: Sie hatte das Geräusch auch gehört. Und es hatte wirklich nicht nach Rocky geklungen. Es hatte geklungen, als käme es von viel weiter unten.", "Und die runden Abdrücke im Puderzucker? Am nächsten Morgen wollte sie nachsehen. Aber da war Uwe schon unten gewesen, um die Taschenlampe zu holen. Und Uwe hatte, ganz Perfektionist, die Kellertreppe gefegt."], "q": "Was oder wer heult nachts im Keller? Und war Rocky allein da unten?"}, {"n": 5, "t": "Der schwärzeste Tag", "p": ["Manche Menschen gehen joggen, um den Kopf frei zu bekommen. Manche machen Yoga. Manche trinken Tee und schauen aus dem Fenster. Susanne saugte.", "Jeden Morgen um halb acht holte sie ihren Staubsauger aus der Abstellkammer im oberen Flur. Er war nicht irgendein Staubsauger. Er war ein treuer Begleiter, ein Freund, ein Partner. Sie hatte ihm sogar einen Namen gegeben, aber den verriet sie niemandem. Gemeinsam zogen sie dann ihre Bahnen: erst der Flur, dann die Küche, dann die Treppe, dann die Gaststube. Gleichmäßig, gründlich, mit dem beruhigenden Brummen, das Susanne mehr bedeutete als jede Musik.", "An diesem Morgen öffnete sie das Fach, um einen neuen Beutel einzusetzen. Der alte war voll. Und sie griff in das Regal, in dem immer, wirklich immer, ein Paket mit zehn Staubsaugerbeuteln lag.", "Das Regal war leer.", "Susanne starrte darauf. Sie sah hinter das Regal. Sie sah unter das Regal. Sie räumte die gesamte Abstellkammer aus: Bügelbrett, Wischmopp, drei Eimer, zwei Kartons Weihnachtsdeko und eine Tüte mit Geschenkpapier, das sie im Januar im Ausverkauf gekauft hatte. Keine Beutel. Nicht ein einziger.", "„Uwe“, sagte sie mit sehr ruhiger Stimme. „Hast du die Staubsaugerbeutel genommen?“", "Uwe kam aus der Küche, ein Brötchen in der Hand. „Warum sollte ich Staubsaugerbeutel nehmen?“", "„Ich weiß es nicht. Warum nimmt man Staubsaugerbeutel?“", "„Man nimmt keine Staubsaugerbeutel. Niemand nimmt Staubsaugerbeutel. Das ist wahrscheinlich das am wenigsten gestohlene Objekt der Menschheitsgeschichte.“", "Aber sie waren weg. Ein ganzes Paket.", "Susanne rief sofort Elaine an. „Es gibt einen zweiten Diebstahl“, sagte sie. „Und der ist schlimmer als der erste.“", "„Schlimmer als der Stollen?“", "„Viel schlimmer. Die Staubsaugerbeutel sind weg.“", "Elaine musste sich sehr zusammenreißen, um nicht zu lachen. Aber sie hörte, dass ihre Mutter es ernst meinte. Todernst.", "„Okay, Mama. Wann hast du sie zuletzt gesehen?“", "„Vorgestern. Da lagen sie noch da. Ganz normal. Ganz friedlich.“", "„Und wer war seitdem in der Abstellkammer?“", "„Niemand. Also, ich. Und die Katzen gehen da manchmal rein, wenn die Tür offen steht. Rocky schläft gern auf dem Geschenkpapier.“", "Elaine schrieb: Diebstahl Nr. 2. Staubsaugerbeutel. Abstellkammer, Obergeschoss. Zugang: alle.", "Susanne bestellte sofort neue Beutel im Internet. Die Lieferzeit war ein Schock: „Voraussichtliche Lieferung in 14 bis 21 Tagen.“", "„Drei Wochen!“, rief Susanne. „Drei Wochen ohne Saugen! Wie soll ich das überleben?“", "„Du könntest fegen“, schlug Uwe vor.", "Susanne sah ihn an, als hätte er vorgeschlagen, das Haus mit einer Zahnbürste zu putzen. Dann holte sie trotzdem den Handfeger. Sie fegte den Flur. Sie fegte die Küche. Sie fegte die Treppe. Es dauerte dreimal so lange wie mit dem Staubsauger, und am Ende hatte sie Rückenschmerzen und das Gefühl, im Mittelalter zu leben.", "„Das ist doch kein Leben“, murmelte sie. „So haben die Leute in Taura vor dreihundert Jahren gelebt. Das weiß ich, das stand in der Ortschronik.“", "Oma Rosita fand die ganze Sache übrigens ziemlich bedenklich. Allerdings aus ganz eigenen Gründen. „Wenn jetzt nicht mehr gesaugt wird“, sagte sie am Telefon, „dann kommt der Staub zu mir hoch. Und von Staub bekomme ich Husten. Und wenn ich Husten habe, kann ich nicht häkeln. Und wenn ich nicht häkeln kann, werden die Topflappen nicht fertig. Und dann habt ihr an Weihnachten keine neuen Topflappen.“", "„Wir haben noch die Topflappen vom letzten Jahr, Mutti. Und vom vorletzten. Und von davor.“", "„Das ist nicht dasselbe“, sagte Rosita beleidigt.", "Am Abend saß Susanne erschöpft auf dem Sofa. Bonnie lag neben ihr, rund und warm und schnurrend. Susanne kraulte ihr den Kopf.", "„Du hast es gut“, sagte sie. „Dir ist es egal, ob gesaugt wird oder nicht.“", "Bonnie öffnete ein Auge und sah sie an. Dann schloss sie es wieder. Und wenn Susanne nicht so erschöpft gewesen wäre, hätte sie vielleicht bemerkt, dass Bonnie in diesem Moment sehr, sehr zufrieden aussah.", "Denn eines wussten alle im Haus: Bonnie hasste den Staubsauger. Sobald er ansprang, verschwand sie unter dem Sofa und kam erst wieder hervor, wenn es seit mindestens zehn Minuten still war. Aber das war ja kein Geheimnis. Und es bedeutete auch nichts. Oder?"], "q": "Wer im Haus hätte einen Grund, die Staubsaugerbeutel verschwinden zu lassen?"}, {"n": 6, "t": "Nikolaus ohne Schuhe", "p": ["Für Susanne war der Nikolaustag einer der wichtigsten Tage des Jahres. Andere Menschen sagten „Ich hab dich lieb“. Susanne kaufte ein Geschenk. Oder drei. Oder, wenn es um Nikolaus ging, ungefähr zwölf.", "Am Abend vorher hatte sie alle Schuhe im Haus gesammelt und gefüllt: Uwes elegante Lederschuhe bekamen Schokoladentaler und ein Paar edle dunkelblaue Socken von Hilfiger, farblich passend zu seinem Lieblingsschal. Oma Rositas Hausschuhe bekamen Pralinen und neue Häkelnadeln. Für Elaine hatte sie ein Päckchen nach Berlin geschickt. Und selbst die Katzen bekamen etwas: zwei kleine Filzstiefel mit Leckerlis, die sie vor die Futternäpfe gestellt hatte.", "Rocky fand seinen Stiefel um vier Uhr morgens, riss ihn um, verteilte die Leckerlis im gesamten Flur und miaute dann so lange, bis jemand aufstand. Bonnie fand ihren Stiefel gar nicht. Sie lag auf dem Sofa und rührte sich nicht. Später am Morgen war der Stiefel trotzdem leer, und niemand konnte sagen, wann das passiert war.", "Um neun Uhr rief Elaine per Video an. Sie hatte ihr Päckchen geöffnet. Darin lag eine echte Lupe mit einem Holzgriff.", "„Für meine Ermittlerin“, stand auf der Karte. „Von deinem Außendienst.“", "„Mama, die ist ja toll!“, rief Elaine und hielt sich die Lupe vor das Auge, sodass es auf dem Bildschirm riesig aussah.", "Susanne strahlte. Genau dafür machte sie das alles.", "Dann aber klingelte das Haustelefon. Oma Rosita. Und Oma Rosita klang nicht nach Nikolaus.", "„Er ist weg“, sagte sie.", "„Wer ist weg?“", "„Mein Schuhanzieher.“", "Man muss dazu wissen: Oma Rositas Schuhanzieher war kein gewöhnlicher Schuhanzieher. Er war lang, fast so lang wie ein Spazierstock, aus dunklem Holz, mit einem Griff aus Messing. Ulli hatte ihn ihr vor vielen Jahren geschenkt, weil ihr Rücken nicht mehr so wollte. Seitdem hing er an einem Haken neben ihrer Wohnungstür. Jeden Tag. Immer am selben Haken.", "Heute hing dort nichts.", "„Ich wollte meine Schuhe anziehen“, sagte Rosita. „Weil Susanne doch Pralinen hineingelegt hat. Ich wollte die Pralinen herausholen und dann die Schuhe anziehen, damit ich sie mal wieder trage. Und da war er weg. Einfach weg.“", "„Mutti, du kannst doch die Pralinen auch so aus dem Schuh holen.“", "„Darum geht es nicht. Ohne Schuhanzieher komme ich nicht in meine Schuhe. Und ohne Schuhe komme ich nicht mal mehr in den Garten. Jetzt bin ich hier gefangen.“", "Elaine, die alles über das Handy mitgehört hatte, schaltete sich ein. „Oma, du gehst doch sowieso höchstens bis in den Garten.“", "Es entstand eine kurze Pause.", "„Aber ich könnte“, sagte Rosita. „Das ist ein großer Unterschied. Bisher konnte ich wenigstens in den Garten. Jetzt habe ich keine Wahl mehr. Jetzt bin ich eine Gefangene in meinem eigenen Haus.“", "Uwe ging sofort hinauf, um zu helfen. Er suchte den ganzen Flur ab, schaute hinter den Schrank, unter die Kommode und sogar in den Schirmständer. Nichts. Der Haken war leer, und auf dem Boden darunter lag nur ein bisschen Staub. Seit drei Tagen hatte ja niemand mehr gesaugt.", "„Ich mache dir einen neuen“, bot Uwe an. „Aus Eiche. Mit eingebrannten Initialen. Ergonomisch geformt. Ich könnte sogar ein kleines Licht einbauen, falls du nachts mal Schuhe anziehen willst.“", "„Ich will meinen alten“, sagte Rosita. „Den hat Ulli mir geschenkt.“", "Darauf wusste niemand etwas zu sagen.", "Am Nachmittag hielt Elaine eine Krisensitzung ab. Sie hatte ihren Notizblock vor sich, und darauf standen jetzt drei Zeilen.", "1. Der Stollen (Keller, neben dem Brunnen)\n2. Die Staubsaugerbeutel (Abstellkammer, oberer Flur)\n3. Der Schuhanzieher (Omas Wohnungstür, ganz oben)", "„Das ergibt doch keinen Sinn“, sagte Susanne. „Wer klaut denn einen Stollen, Staubsaugerbeutel und einen Schuhanzieher? Was hat das miteinander zu tun?“", "„Vielleicht ein Sammler“, sagte Uwe. „Es gibt Menschen, die sammeln die merkwürdigsten Dinge. In Berlin gab es sogar mal ein Museum nur für Currywurst. Da wäre ein Staubsaugerbeutel-Museum gar nicht so abwegig.“", "„Papa, niemand bricht in Taura ein, um ein Museum zu gründen.“", "Elaine starrte auf ihre Liste. Irgendetwas daran störte sie. Drei Dinge, die nichts miteinander zu tun hatten. Drei Orte, die über das ganze Haus verteilt waren, vom Dachgeschoss bis in den Keller. Und ein Dieb, den niemand gesehen und niemand gehört hatte.", "Niemand gehört. Das war es. In einem Haus, in dem Rocky jeden Schritt kommentierte, in dem jede Treppenstufe knarrte und Oma Rosita jedes Geräusch meldete, war jemand dreimal unbemerkt unterwegs gewesen.", "Wer konnte so leise sein?"], "q": "Stollen, Staubsaugerbeutel, Schuhanzieher: Was haben diese drei Dinge gemeinsam?"}, {"n": 7, "t": "Die Ermittlungswand", "p": ["„Jeder gute Ermittler braucht eine Ermittlungswand“, sagte Elaine am Telefon. „Mit Fotos, Zetteln und roten Fäden, die alles miteinander verbinden. Wie im Fernsehen.“", "„Wo soll die denn hin?“, fragte Susanne.", "„An den Tresen. Der ist groß, und da kommt jeder vorbei.“", "Der alte Tresen war das Herz der Gaststube. Dunkles, schweres Holz, an manchen Stellen glänzend gewetzt von unzähligen Ellenbogen. Hinter ihm hatte Opa Ulli jahrzehntelang gestanden, Bier gezapft, zugehört und die Probleme des halben Dorfes gelöst. Wenn es in Taura irgendwo einen Ort gab, an dem man einen Fall lösen konnte, dann hier.", "Susanne machte sich sofort an die Arbeit. Sie zeichnete einen Plan des Hauses auf ein großes Stück Packpapier: unten der Keller mit dem Brunnen, darüber die Gaststube mit Tresen, Stammtisch, Lagerräumen und Betriebsküche, dann die Wohnung, ganz oben Omas Reich. Hinter dem Haus zeichnete sie den Garten mit Uwes Holzterrasse und den Schuppen.", "Dann brauchte sie rote Fäden.", "Sie stieg zu Oma hinauf. „Mutti, hast du rote Wolle?“", "Oma Rosita besaß ungefähr vierhundert Knäuel Wolle in allen Farben, die man sich vorstellen kann. Trotzdem überlegte sie lange. „Wofür brauchst du die?“", "„Für die Ermittlungen.“", "„Die gute Wolle kriegst du nicht. Die ist für die Topflappen.“", "Am Ende bekam Susanne ein kleines Knäuel in einem etwas traurigen Rostrot, das Rosita „sowieso nie leiden konnte“.", "Und dann kam Uwe. Uwe sah sich die Ermittlungswand an, die Susanne mit Klebestreifen am Tresen befestigt hatte, legte den Kopf schief und sagte: „Das ist schief.“", "„Das ist eine Ermittlungswand. Die darf schief sein.“", "„Nichts darf schief sein.“", "Was folgte, waren zwei Stunden, in denen Uwe die Ermittlungswand neu aufbaute. Er holte eine Wasserwaage. Er maß mit dem Zollstock. Er schnitt die Zettel auf exakt dieselbe Größe zu und laminierte sie. Er befestigte die roten Fäden mit kleinen Messingnägeln, die er extra aus seiner Werkstatt geholt hatte, und spannte sie so straff, dass sie leise sirrten, wenn man dagegen schnippte.", "Am Ende sah die Ermittlungswand aus wie aus einem Museum. Selbst Elaine war beeindruckt, als Susanne sie ihr per Video zeigte.", "„Papa, das ist wunderschön.“", "„Ich weiß“, sagte Uwe bescheiden.", "Dann begann die eigentliche Arbeit. Elaine ließ sich die Wand ganz nah zeigen und ging alles noch einmal durch.", "„Erstens: Der Stollen. Verschwunden im Keller, neben dem Brunnen. Zweitens: Die Staubsaugerbeutel. Verschwunden aus der Abstellkammer im ersten Stock. Drittens: Der Schuhanzieher. Verschwunden ganz oben, vor Omas Tür.“", "„Und was sagt uns das?“, fragte Susanne.", "„Mama, zieh mal einen Faden von allen drei Orten zu der Stelle, an der man sie am schnellsten erreicht.“", "Susanne tat es. Und dann sah sie es auch.", "Alle drei Fäden liefen über denselben Weg: die Treppe. Vom obersten Stock, an der Abstellkammer vorbei, durch den Flur und dann hinunter, bis zur alten, klemmenden Kellertür.", "„Alles liegt auf einer Linie“, sagte Elaine langsam. „Von ganz oben bis ganz unten. Als hätte jemand die Dinge nach unten getragen.“", "„Ein Einbrecher wäre durch die Haustür gekommen“, sagte Uwe. „Oder durch ein Fenster. Er wäre nicht bis in Omas Stockwerk gestiegen, um einen Schuhanzieher zu holen.“", "„Genau. Ich glaube, unser Dieb kommt nicht von draußen. Ich glaube, unser Dieb wohnt im Haus.“", "Es war plötzlich sehr still in der Gaststube. Susanne sah Uwe an. Uwe sah Susanne an. Dann sahen beide zur Decke, wo, ein Stockwerk über ihnen, Oma Rosita wohnte.", "„Nicht Oma“, sagte Susanne. „Die geht doch nicht in den Keller.“", "„Und ich war es auch nicht“, sagte Uwe schnell.", "Elaine hob ihre neue Lupe. „Apropos. Wir haben da noch eine Sache offen. Mama, hast du die Krümel von Papas Pullover aufgehoben?“", "Susanne hatte. Natürlich hatte sie. Sie hatte sie in einer kleinen Dose aufbewahrt, sauber beschriftet: Beweisstück Nr. 1. Daneben stellte sie eine zweite Dose mit Puderzucker und Krümeln vom Kellerboden. Beweisstück Nr. 2. Dann legte sie Elaines Lupe, die sie zum Glück doppelt gekauft hatte, darüber und hielt das Handy ganz nah heran.", "Die Krümel von Uwes Pullover waren dunkelbraun, grob und rochen nach Zimt und Nelken. Die Krümel aus dem Keller waren hell, fein, voller Butter und Puderzucker.", "„Lebkuchen“, sagte Elaine. „Papa hatte recht.“", "„Ich habe immer recht, wenn es ums Essen geht“, sagte Uwe zufrieden.", "„Damit bist du nicht frei“, sagte Elaine. „Aber ein bisschen weniger verdächtig.“", "Uwe nahm einen laminierten Zettel mit der Aufschrift „Uwe“ von der Wand und hängte ihn zehn Zentimeter weiter nach rechts. In die Spalte „Etwas weniger verdächtig“. Er benutzte dafür die Wasserwaage."], "q": "Wenn der Dieb im Haus wohnt, wer kommt dann infrage? Geht ihr die Bewohner einmal durch."}, {"n": 8, "t": "Das Verhör", "p": ["„Ich möchte Rocky verhören“, sagte Elaine.", "Susanne zögerte. „Elaine, das ist eine Katze.“", "„Er ist der Hauptverdächtige. Er ist nachts überall. Er war im Keller, als ihr unten wart. Und er hat bisher kein einziges Alibi. Er hat ein Recht darauf, angehört zu werden.“", "Also wurde Rocky verhört. Das war schwieriger als gedacht, denn zunächst musste man ihn finden. Er war weder in der Küche noch im Flur noch auf dem Geschenkpapier in der Abstellkammer. Am Ende fand Uwe ihn oben auf dem Kleiderschrank im Schlafzimmer, von wo er sich mit einem gewaltigen Satz auf Uwes Schulter stürzte und ihn dabei fast umwarf.", "Susanne setzte ihn auf den Stammtisch, direkt vor das Handy.", "„Rocky“, sagte Elaine ernst. „Wo warst du in der Nacht vom ersten auf den zweiten Dezember?“", "„Mau“, sagte Rocky.", "„Hast du den Stollen angeknabbert?“", "„Mau! Mau mau!“", "„Was hast du im Keller gemacht?“", "„Maaauuu.“", "So ging es ungefähr zehn Minuten weiter. Rocky beantwortete jede Frage. Er beantwortete auch Fragen, die gar nicht gestellt worden waren. Er miaute, wenn Elaine sprach, und er miaute, wenn Elaine eine Pause machte. Zwischendurch versuchte er, das Handy abzulecken.", "„Interessant“, sagte Uwe, der das Ganze mit verschränkten Armen beobachtete. „Wusstet ihr, dass erwachsene Katzen untereinander kaum miauen? Das Miauen ist eigentlich eine Sprache für uns Menschen. Kätzchen miauen nach der Mutter, aber erwachsene Katzen machen das fast nur noch, um mit Menschen zu reden.“", "„Dann redet Rocky aber sehr viel mit uns“, sagte Susanne.", "„Rocky hat uns sehr viel zu sagen“, sagte Uwe. „Leider verstehen wir kein Wort.“", "Im Hintergrund, auf dem Sofa, lag Bonnie und sah dem Verhör zu. Sie hatte ihren Kopf auf die Pfoten gelegt, und ihr runder Bauch hob und senkte sich ruhig. Sie miaute nicht. Sie miaute nie. Elaine konnte sich ehrlich gesagt nicht erinnern, Bonnie jemals miauen gehört zu haben.", "„Ist Bonnie dicker geworden?“, fragte Elaine plötzlich.", "Uwe drehte sich um und betrachtete Bonnie mit dem prüfenden Blick eines Mannes, der sein Leben lang Dinge vermessen hat. „Ja“, sagte er. „Eindeutig. Sie ist runder. Ich würde schätzen, zwei Zentimeter im Umfang.“", "„Das ist das Winterfell“, sagte Susanne. „Die kriegt jedes Jahr Winterfell. Außerdem bewegt sie sich ja kaum. Die liegt seit Tagen nur auf dem Sofa.“", "Bonnie gähnte ausführlich und drehte sich auf die andere Seite.", "Und dann passierte es. Rocky, dem das Verhör inzwischen langweilig geworden war, sprang vom Stammtisch, rannte einmal quer durch die Gaststube, schlitterte über die Dielen und kam mit etwas im Maul zurück. Er ließ es stolz vor Susannes Füßen fallen und miaute triumphierend.", "Susanne hob es auf. Es war ein Stück Papier. Ein Fetzen, ungefähr so groß wie eine Spielkarte, dick, leicht flauschig und mit einem aufgedruckten Pfeil.", "Darauf stand: „Filterbeutel – Bitte so einsetzen.“", "„Das ist ein Staubsaugerbeutel“, flüsterte Susanne. „Das ist einer von meinen Staubsaugerbeuteln!“", "Es war, als hätte jemand im Gerichtssaal eine Tatwaffe hochgehalten. Uwe schnappte nach Luft. Susanne hielt den Fetzen mit zitternden Fingern ins Licht. Und Rocky saß da, putzte sich eine Pfote und machte nicht im Geringsten den Eindruck eines Täters, der gerade überführt worden war.", "„Rocky!“, sagte Susanne. „Wo hast du das her?“", "„Mau“, sagte Rocky.", "„Na bitte“, sagte Uwe. „Ein Geständnis.“", "„Das war kein Geständnis, Papa. Das war ein Mau.“", "Elaine ließ sich den Fetzen ganz nah zeigen. Er war an den Rändern zerfasert, als hätte jemand daran gekaut oder damit gespielt. Und an einer Ecke klebte etwas Weißes, Feines.", "„Mama, ist das Puderzucker?“", "Susanne roch daran. „Das ist Puderzucker.“", "Jetzt hatten sie eine Verbindung. Der Staubsaugerbeutel und der Stollen hatten Kontakt gehabt. Sie mussten irgendwo am selben Ort gelegen haben.", "Uwe nahm den laminierten Zettel „Rocky“ und schob ihn feierlich in die Spalte „Hauptverdächtiger“.", "Aber Elaine blieb nachdenklich. „Ich weiß nicht“, sagte sie. „Rocky ist laut. Rocky ist immer laut. Er kündigt alles an, was er tut. Wenn er einen Stollen klauen würde, dann würde er das ganze Haus aufwecken und vorher noch Bescheid sagen.“", "„Vielleicht ist das seine Strategie“, sagte Uwe. „Er ist so laut, dass ihn niemand für einen Dieb hält.“", "„Oder“, sagte Elaine, „jemand anderes ist so leise, dass ihn niemand für einen Dieb hält.“", "Auf dem Sofa schnurrte Bonnie im Schlaf."], "q": "Ist Rocky überführt? Wo könnte er den Fetzen gefunden haben?"}, {"n": 9, "t": "Die Geschichte vom Wirt mit der Dienstmarke", "p": ["Susanne liebte Geschichten. Nicht die aus Büchern, sondern die echten: Wer früher in welchem Haus in Taura gewohnt hatte, wer mit wem verwandt war, wo der alte Bäcker seinen Laden gehabt hatte und warum eine bestimmte Straße so heißt, wie sie heißt. Wenn irgendwo im Ort jemand etwas Altes erzählte, war Susanne die Erste, die zuhörte.", "Und weil der Fall feststeckte, tat sie, was sie am besten konnte: Sie suchte in der Vergangenheit.", "Im hinteren Lagerraum der Gaststätte standen, zwischen alten Gläsern und Tischdecken, ein paar Kartons, die seit Jahren niemand geöffnet hatte. Susanne zog den ersten heraus, pustete den Staub ab und hustete. Dann öffnete sie ihn.", "Darin lagen Speisekarten aus Gaststättenzeiten, ein paar vergilbte Fotos und eine dicke Mappe mit Zeitungsausschnitten. Ganz oben lag ein Artikel aus der Lokalzeitung, mit Foto. Darauf war ein Mann zu sehen, der hinter einem Tresen stand. Er hatte freundliche Augen, ein breites Lächeln und trug über dem Polizeihemd eine weiße Schürze.", "„Der Wirt mit der Dienstmarke“, stand darüber.", "Susanne setzte sich auf eine Bierkiste und las. Der Artikel erzählte von Ulli Hering, der tagsüber Streife fuhr und abends hinter dem Tresen stand. Von einem Mann, der so geduldig war, dass er einem Stammgast drei Stunden lang zuhören konnte, ohne einmal auf die Uhr zu sehen. Und der so gutmütig war, dass man im Dorf sagte, bei Ulli würde sogar ein Dieb noch ein Bier ausgegeben bekommen, bevor er ihn mitnahm.", "Susanne nahm die Mappe mit nach oben. Sie klopfte bei Oma Rosita.", "Rosita saß in ihrem Sessel und häkelte. Neben ihr auf dem kleinen Tisch lagen drei fertige Topflappen und eine Schüssel mit Pfefferkuchen. Als sie das Foto von Ulli sah, legte sie die Häkelnadel weg.", "„Das war im Sommer“, sagte sie. „Da war es so heiß, dass das Bier schneller warm wurde, als man es trinken konnte.“", "„Mutti, erzähl mal. Wie war das damals?“", "Und Rosita erzählte. Sie erzählte von den Kegelabenden, bei denen die Männer so laut wurden, dass man es bis zur Kirche hörte. Vom Stammtisch, an dem jeden Freitag dieselben acht Leute saßen. Von Silvesterfeiern, bei denen getanzt wurde, bis die Dielen knarrten. Und davon, wie Ulli alles im Griff hatte. Nie laut, nie hektisch. Er hörte einfach zu, und irgendwie lösten sich die Probleme dann von selbst.", "„Er war Polizist mit Leib und Seele“, sagte Rosita. „Sogar hier im Haus hat er ermittelt. Weißt du noch, die Sache mit den Broilerbeinen?“", "Susanne erinnerte sich nur dunkel. Samstags hatten sie und ihre Schwester Sylvia früher oft in der Küche geholfen, aber von verschwundenen Broilerbeinen wusste sie nichts. „Welche Broilerbeine?“", "Rosita lächelte, und es war ein seltenes Lächeln, eines, das sie nicht oft zeigte. „Samstags gab es bei uns immer Broiler. Halbe Hähnchen, frisch aus der Betriebsküche. Die Leute kamen von weit her dafür. Und jeden Samstag, ich schwöre dir, jeden Samstag fehlten Broilerbeine. Nicht die ganzen Hähnchen. Nur die Beine. Ulli hat sie gezählt, bevor sie in den Ofen kamen, und er hat sie gezählt, als sie wieder rauskamen. Und jedes Mal fehlten zwei. Manchmal drei.“", "„Und wer war es?“", "„Das ist es ja“, sagte Rosita. „Er hat es nie gesagt. Er hatte so ein kleines Notizbuch, in das er alles aufgeschrieben hat. Seine Akte, hat er es genannt. Und irgendwann, ich weiß gar nicht mehr, wann, ist er grinsend in die Küche gekommen und hat gesagt: Rosi, der Fall ist gelöst. Ich hab gefragt: Wer war es? Und er hat nur gelächelt und gesagt: Das bleibt unter uns. Unter mir und dem Täter.“", "„Und das Notizbuch?“", "Rosita zuckte mit den Schultern. „Weg. Ich habe es nie wieder gesehen. Ich habe auch nie danach gesucht. Ich dachte immer, er hat es irgendwo hingetan, wo es hingehört.“ Sie nahm ihre Häkelnadel wieder auf. „Das war typisch Ulli. Der hat Dinge gewusst und nicht gesagt. Und der hat einem dann trotzdem das Gefühl gegeben, dass alles in Ordnung ist.“", "Am Abend erzählte Susanne Elaine alles. Elaine hörte lange zu.", "„Mama“, sagte sie dann. „Opa hat in genau diesem Haus schon einmal einen Diebstahl aufgeklärt. Mit Essen, das aus der Küche verschwunden ist.“", "„Ja. Und?“", "„Und vielleicht hat er sein Notizbuch hier irgendwo versteckt. Vielleicht steht da drin, wie er es gemacht hat.“", "Susanne sah auf die Ermittlungswand. Sie sah auf den Tresen, hinter dem Ulli jahrzehntelang gestanden hatte. Und auf einmal hatte sie das Gefühl, als würde er ihnen ein kleines bisschen über die Schulter schauen.", "Ganz oben auf die Ermittlungswand hängte sie das Foto aus der Zeitung. Uwe richtete es später mit der Wasserwaage aus."], "q": "Wer könnte damals die Broilerbeine geklaut haben? Habt ihr einen Verdacht?"}, {"n": 10, "t": "Uwes perfekte Falle", "p": ["Uwe hatte genug. Er war ein Mann der Tat, und das ganze Rätseln, Verhören und Fäden-Spannen war ihm auf Dauer zu theoretisch. Wenn es einen Dieb gab, dann musste man ihn fangen. Und wenn man ihn fangen wollte, dann brauchte man eine Falle.", "„Eine Falle?“, fragte Elaine skeptisch über das Handy.", "„Nicht irgendeine Falle“, sagte Uwe. „Die perfekte Falle.“", "Er verschwand in seiner Werkstatt und kam drei Stunden lang nicht wieder heraus. Aus der Werkstatt drangen Geräusche: Sägen, Bohren, Hämmern, ein kurzes Fluchen, dann wieder Sägen. Einmal kam er heraus, holte sich in der Küche zwei Scheiben Brot mit Leberwurst und verschwand sofort wieder. Ein anderes Mal kam er heraus und fragte Susanne, ob sie noch die alte Türklingel hätten, die man früher in der Gaststube abmontiert hatte.", "Als er endlich fertig war, war es schon dunkel. Er trug sein Werk feierlich in die Gaststube und stellte es auf den Stammtisch.", "Es war eine Kiste aus hellem Holz, ungefähr so groß wie ein Schuhkarton, aber länger. Die Kanten waren abgerundet und geschliffen, die Oberfläche geölt, und an der Seite hatte Uwe mit einem Brennkolben ein kleines Wappen eingebrannt: ein Schlüssel und ein Stollen, gekreuzt. An einem Ende befand sich eine Klappe, die mit einer Feder gespannt war. Innen, ganz hinten, gab es eine kleine Haltevorrichtung für den Köder. Und oben auf der Kiste, an zwei Drähten befestigt, saß die alte Türklingel der Gaststätte.", "„Das Prinzip ist simpel“, erklärte Uwe. „Der Täter riecht den Köder. Er kriecht in die Kiste. Er berührt den Köder. Dadurch löst sich der Haken, die Klappe schließt sich, und gleichzeitig wird ein Stromkreis geschlossen, der die Klingel auslöst. Wir hören es, kommen herunter, und schon haben wir ihn.“", "„Papa, das ist wirklich schön“, sagte Elaine. „Aber was, wenn der Täter größer ist als die Kiste?“", "Uwe sah sie an, als hätte sie gefragt, ob die Erde flach sei. „Der Täter frisst Stollen und klaut Staubsaugerbeutel. Der Täter ist nicht groß. Ein großer Täter hätte den ganzen Stollen genommen.“", "Dagegen konnte man nichts sagen.", "„Und was nimmst du als Köder?“, fragte Susanne.", "Uwe hatte lange darüber nachgedacht. Am liebsten hätte er ein Stück Stollen genommen, aber als er Oma Rosita danach fragte, sagte sie nur: „Ich backe doch nicht drei Tage lang, damit du mit meinem Stollen einen Verbrecher fütterst.“ Also entschied er sich für eine Knackwurst. Eine sehr gute Knackwurst vom Fleischer, fein geräuchert, mit schöner Haut.", "„Ich hätte die ja auch gern gegessen“, sagte er traurig, als er sie in die Haltevorrichtung steckte. „Das ist ein großes Opfer.“", "„Du bringst es für einen guten Zweck“, sagte Susanne.", "„Das weiß ich. Es fühlt sich trotzdem schlimm an.“", "Vor dem Schlafengehen holte Uwe noch Holz aus dem Schuppen hinter dem Haus. Er wollte die Kiste im Keller etwas erhöht aufstellen, auf zwei Holzklötzen, damit sie nicht in der Feuchtigkeit stand. Er ließ die Schuppentür dabei kurz offen stehen, während er die Klötze heraussuchte, und irgendwo hinter ihm raschelte es. Uwe achtete nicht weiter darauf. Er war zu sehr mit seiner Falle beschäftigt.", "Dann trug er die Kiste in den Keller. Er platzierte sie direkt vor dem Regal mit dem Stollen, sodass jeder, der zum Stollen wollte, an ihr vorbei musste. Er richtete sie exakt aus. Er prüfte noch einmal die Feder, die Klappe und die Klingel. Und dann, weil es ein Kunstwerk war und Kunstwerke Beachtung verdienen, machte er ein Foto und schickte es Elaine.", "„Sieht aus wie ein Designerstück“, schrieb Elaine zurück. „Viel Glück. Ich bin gespannt, wen ihr fangt.“", "Um Mitternacht lag das ganze Haus im Dunkeln. Oma schlief, Susanne schlief, und Bonnie lag, wie immer, auf dem Sofa in der Gaststube. Von Rocky war seltsamerweise nichts zu hören. Das fiel nur niemandem auf, weil alle so froh über die Ruhe waren.", "Nur Uwe lag wach. Er dachte an seine Falle. Er dachte an die Klappe. Er dachte, ob die Feder auch wirklich stark genug war.", "Und er dachte an die Knackwurst."], "q": "Wer, glaubt ihr, geht heute Nacht in die Falle?"}, {"n": 11, "t": "Wer in die Falle ging", "p": ["Um 2 Uhr 47 klingelte die Türklingel im Keller.", "Es war kein langes Klingeln. Nur ein kurzes, hartes „Dring!“. Dann ein Poltern, ein dumpfer Schlag und ein sehr menschlicher Laut, irgendetwas zwischen „Au“ und „Mist“.", "Susanne schlief so tief, dass sie nichts davon hörte. Oma Rosita hörte es und rief nicht an, weil sie, wie sie später erklärte, „dachte, es wäre mal wieder das Ende der Welt, und da kann man eh nichts machen“.", "Um sieben Uhr morgens wachte Susanne auf, und Uwes Bettseite war leer und kalt.", "Sie fand ihn im Keller.", "Uwe kniete auf dem Boden vor dem Regal. Sein rechter Arm steckte bis zum Ellenbogen in seiner perfekten Falle. Die Klappe war zugeschnappt, die Feder hielt sie fest, und weil er die Klappe so passgenau gebaut hatte, kam er nicht mehr heraus. Er trug seinen schwarzen Rollkragenpullover von Hilfiger und sah aus wie ein sehr eleganter, sehr müder Geheimagent, der seit vier Stunden mit einer Holzkiste verwachsen war.", "„Guten Morgen“, sagte er würdevoll.", "„Uwe! Was machst du da?“", "„Ich habe die Falle überprüft.“", "„Um drei Uhr nachts?“", "„Ich konnte nicht schlafen. Ich wollte nur sehen, ob die Knackwurst noch richtig sitzt.“", "„Und dann?“", "Uwe schwieg einen Moment. „Dann habe ich überprüft, ob sie noch gut riecht.“", "Susanne öffnete die Klappe, und Uwe zog seinen Arm heraus. In seiner Hand hielt er die Knackwurst. Sie war unversehrt. Na ja, fast. An einem Ende fehlte ein kleines Stück.", "„Das war ich“, sagte Uwe. „Das gebe ich zu. Aber nur ein ganz kleines Stück. Zur Qualitätskontrolle.“", "Susanne rief Elaine an und hielt das Handy so, dass Elaine ihren Vater sehen konnte, der sich gerade den Arm massierte.", "Elaine sah ihn lange an. „Papa. Du bist in deine eigene Falle gegangen.“", "„Sie funktioniert“, sagte Uwe. „Das ist das Wichtigste. Sie funktioniert hervorragend.“", "Aber dann wurde er plötzlich ernst. „Ich muss euch etwas erzählen“, sagte er. „Als ich da unten festsaß, im Dunkeln, da war ich nicht allein.“", "Susanne bekam eine Gänsehaut. „Was meinst du?“", "„Das Licht war aus. Ich bin ja nur mit der Handy-Taschenlampe runter, und das Handy ist mir aus der Hand gefallen, als die Klappe zuschnappte. Es lag mit dem Display nach unten auf dem Boden. Und dann war es stockdunkel. Und so nach einer Stunde, vielleicht nach anderthalb, habe ich etwas gehört.“", "„Was?“", "„Tapsen. Ganz leise. Tapp. Tapp. Tapp. Und dann hat mich etwas gestreift. Hier, am Bein. Es war weich. Es war warm. Und es war …“ Uwe suchte nach dem richtigen Wort. „Es war rund.“", "„Rund?“", "„Rund. Und dann habe ich ein Rascheln gehört. Wie ein Tuch, das zur Seite geschoben wird. Direkt über mir, auf dem Regal. Und dann ein Schmatzen. Ein ganz leises, zufriedenes Schmatzen. Und dann wieder Tapsen. Und dann war es weg.“", "„Und es hat keinen Laut gemacht?“, fragte Elaine. „Kein Miauen, kein Fauchen, nichts?“", "„Keinen Mucks“, sagte Uwe. „Es war das leiseste Ding, das ich je erlebt habe.“", "Susanne leuchtete auf das Regal. Das Küchentuch war wieder verschoben. Und vom Stollen fehlte ein weiteres, ordentliches Stück.", "Sie sahen sich an.", "„Uwe“, sagte Susanne langsam. „Du warst die ganze Nacht hier unten. Mit dem Arm in der Kiste. Du konntest gar nicht an den Stollen ran.“", "Uwe streckte seinen freien linken Arm in Richtung Regal. Es fehlten ungefähr vierzig Zentimeter.", "„Ich habe ein Alibi!“, rief er, und seine Augen leuchteten. „Ich habe ein wasserdichtes Alibi! Ich war in meiner eigenen Falle gefangen, als das Verbrechen geschah!“", "„Das ist das merkwürdigste Alibi, das ich je gehört habe“, sagte Elaine. „Aber es ist ein Alibi.“", "Später an diesem Morgen ging Uwe zur Ermittlungswand, nahm seinen Zettel und hängte ihn, mit Wasserwaage, in eine ganz neue Spalte, die er extra dafür anlegte. Sie hieß: „Unschuldig. Nachweislich.“", "„Aber wer war es dann?“, fragte Susanne. „Was ist rund, weich, warm und macht keinen Mucks?“", "„Ein Marder“, sagte Uwe sofort. „Marder leben gern in alten Häusern, in Dachböden und Kellern. Die sind nachtaktiv, die sind schlau, die fressen fast alles. Und sie sind sehr leise.“", "„Ein Marder, der Staubsaugerbeutel und Schuhanzieher klaut?“", "„Ein sehr ordentlicher Marder.“", "Elaine sagte nichts. Sie schrieb nur in ihr Notizbuch: Täter: leise. Weich. Rund. Liebt Stollen.", "Dann unterstrich sie das Wort „rund“ zweimal."], "q": "Was war das, was Uwe im Dunkeln gestreift hat? Und wo war eigentlich Rocky in dieser Nacht?"}, {"n": 12, "t": "Alle Neune", "p": ["„Sie haben wieder gekegelt“, sagte Oma Rosita am Telefon.", "Susanne hatte gerade Uwes Arm mit Salbe eingerieben und war nicht ganz bei der Sache. „Wer hat gekegelt?“", "„Die alten Stammgäste. Die Toten. Heute Nacht. Ich habe es genau gehört. Draußen am Schuppen. Rumms, und dann rollt was, und dann wieder rumms. Genau wie früher an den Kegelabenden. Die sind zurückgekommen.“", "„Mutti, die Kegelbahn gibt es doch gar nicht mehr.“", "„Eben“, sagte Rosita düster. „Deshalb ist es ja so unheimlich.“", "Die Kegelbahn von Herings Gaststätte war einmal der ganze Stolz des Hauses gewesen. Eine lange, schmale Bahn aus poliertem Holz, mit einer Rinne, in der die Kugeln zurückrollten, und neun Kegeln am Ende, die von Hand wieder aufgestellt werden mussten. An den Kegelabenden war es hier so laut, dass man sein eigenes Wort nicht verstand. Später, als die Gaststätte schloss, hatte man an dieser Stelle einen Schuppen gebaut. Die Kegelbahn lag seitdem darunter. Verborgen, aber nicht vergessen.", "Susanne zog ihre Jacke an. Uwe, noch immer etwas steif im Arm, zog seinen Wintermantel an, dazu einen Schal, der farblich perfekt auf seine Mütze abgestimmt war. Dann gingen sie hinaus in den Garten, vorbei an Uwes Holzterrasse, auf der Reif glitzerte, bis zum Schuppen.", "Die Tür war zu. Uwe wusste, dass er sie gestern Abend geschlossen hatte, nachdem er die Holzklötze für die Falle geholt hatte.", "Von drinnen kam ein Geräusch. Ein Kratzen. Und dann, ganz deutlich: „Mau.“", "Uwe öffnete die Tür.", "Mitten im Schuppen, zwischen Rasenmäher, Gartengeräten und Uwes sorgfältig gestapelten Holzresten, saß Rocky. Er sah unverschämt zufrieden aus. Und um ihn herum lagen, kreuz und quer verteilt, neun alte Holzkegel.", "„Die Kegel!“, rief Uwe. „Die Kegel von der alten Kegelbahn! Die habe ich hier aufbewahrt. Aus nostalgischen Gründen. Die standen ordentlich in einer Reihe auf dem obersten Regal.“", "Sie standen nicht mehr ordentlich in einer Reihe. Rocky hatte sie offensichtlich die ganze Nacht über, einen nach dem anderen, vom Regal gestoßen, ihnen hinterhergejagt und sie quer durch den Schuppen gerollt. Rumms. Rollen. Rumms.", "„Alle neune“, sagte Susanne und musste lachen. „Rocky hat alle neune geschafft.“", "„Er ist gestern Abend reingeschlüpft, als ich das Holz geholt habe“, sagte Uwe. „Ich habe es rascheln gehört, aber ich war so mit meiner Falle beschäftigt.“", "Rocky streckte sich, gähnte, schritt an ihnen vorbei aus dem Schuppen, als wäre er der König von Taura, und miaute laut und anklagend in Richtung Küche. Er hatte offensichtlich Hunger. Nach einer Nacht Kegeln kein Wunder.", "Susanne rief Oma an. „Mutti, keine Geister. Das war Rocky. Er war im Schuppen eingesperrt und hat mit den alten Kegeln gespielt.“", "Rosita war hörbar enttäuscht. „Na gut“, sagte sie. „Aber früher, da haben sie wirklich so gekegelt. Ulli hat immer verloren, mit Absicht, damit die Stammgäste sich freuen. Und einmal …“ Sie machte eine Pause. „Einmal habe ich alle neune geworfen. Mit dem ersten Wurf. Da haben alle gejubelt. Und Ulli hat mich hochgehoben, mitten auf der Kegelbahn.“", "Susanne hörte, dass ihre Mutter lächelte.", "Als sie wieder im Haus waren, saßen sie an der Ermittlungswand und riefen Elaine an. Elaine hörte sich alles an, und dann wurde sie ganz still.", "„Wartet mal“, sagte sie. „Rocky war die ganze Nacht im Schuppen eingesperrt?“", "„Ja. Seit gestern Abend.“", "„Und Papa war die ganze Nacht im Keller in der Falle.“", "„Ja“, sagte Uwe stolz.", "„Und in genau dieser Nacht ist wieder ein Stück vom Stollen verschwunden.“", "Susanne verstand. Uwe verstand auch. Langsam drehten sich beide zur Ermittlungswand um.", "„Dann hat Rocky auch ein Alibi“, sagte Susanne. „Er kann es nicht gewesen sein.“", "Uwe holte die Wasserwaage. Feierlich hängte er den Zettel „Rocky“ neben seinen eigenen, in die Spalte „Unschuldig. Nachweislich.“ Dann trat er zurück und betrachtete die Wand.", "In der Spalte „Verdächtig“ hing jetzt nur noch ein einziger Zettel. Auf dem stand in Elaines Handschrift, ganz klein: „Oma?“", "„Das ist doch Unsinn“, sagte Susanne. „Mutti geht nicht in den Keller. Sie geht ja nicht mal über den Gartenzaun hinaus.“", "Doch dann fiel ihr etwas ein. Etwas, an das sie seit Tagen nicht mehr gedacht hatte. Vor ein paar Nächten, als sie kurz aufgestanden war, um ein Glas Wasser zu trinken, hatte sie unten in der alten Betriebsküche Licht gesehen. Nur einen schmalen Streifen unter der Tür. Sie hatte gedacht, Uwe hätte es angelassen.", "Aber Uwe hatte in dieser Nacht neben ihr geschlafen. Das wusste sie genau. Er hatte geschnarcht."], "q": "Wer war nachts in der Betriebsküche? Und wer bleibt jetzt noch übrig?"}, {"n": 13, "t": "Omas Geheimnis", "p": ["Susanne stellte sich in dieser Nacht einen Wecker. Um halb eins stand sie leise auf, zog ihre Strickjacke über und setzte sich in den dunklen Flur, direkt neben die Treppe. Von hier aus konnte sie sehen, wer hinauf- oder hinunterging. Sie kam sich ein bisschen vor wie eine Spionin. Es war aufregend und gleichzeitig unglaublich langweilig.", "Um eins passierte nichts. Um Viertel nach eins kam Rocky vorbei, setzte sich vor sie hin, miaute einmal fragend und verschwand wieder. Um halb zwei war Susanne fast eingeschlafen.", "Und dann knarrte über ihr eine Stufe.", "Susanne hielt den Atem an. Langsam, Stufe für Stufe, kam jemand die Treppe herunter. Ein schmaler Lichtkegel tanzte über die Wand. Dann tauchte die Gestalt auf: in einem geblümten Morgenmantel, mit Lockenwicklern im Haar, einer kleinen Taschenlampe in der einen Hand und einem Korb in der anderen. Die Gestalt hielt sich am Geländer fest, ging vorsichtig und atmete schwer. Aber sie ging. Ganz allein. Mitten in der Nacht. Die Treppe hinunter.", "Es war Oma Rosita.", "Susanne war so verblüfft, dass sie sich nicht rührte. Rosita ging an ihr vorbei, ohne sie zu bemerken, und verschwand durch die Gaststube in Richtung der alten Betriebsküche. Eine Tür ging auf. Licht fiel heraus. Und dann ging die Tür wieder zu.", "Susanne schlich hinterher und legte ihr Ohr an die Tür. Sie hörte Klappern. Sie hörte das Öffnen und Schließen einer Ofentür. Und dann roch sie etwas. Butter. Zitronat. Rosinen.", "Am nächsten Morgen fand die große Befragung statt. Elaine war per Video zugeschaltet, Uwe saß am Tresen, Susanne stand neben der Ermittlungswand, und Oma Rosita saß auf dem Stammtischstuhl, auf dem früher immer Ulli gesessen hatte, wenn er mal Pause machte. Sie hatte die Arme verschränkt.", "„Oma“, begann Elaine vorsichtig. „Mama hat dich heute Nacht gesehen. Du warst unten. In der Betriebsküche.“", "„Ich sage nichts“, sagte Rosita.", "„Oma, wir wollen nur verstehen …“", "„Ich sage nichts. Mir glaubt ja sowieso keiner. Wenn ich was sage, heißt es doch nur wieder, die Oma spinnt.“", "„Niemand sagt, dass du spinnst.“", "„Aber denken tut ihr es.“", "Uwe räusperte sich. „Rosita, es geht hier um einen Stollendiebstahl. Und um Staubsaugerbeutel. Und um einen Schuhanzieher. Du verstehst sicher, dass es merkwürdig aussieht, wenn jemand, der nachts sonst keinen Fuß vor die Wohnungstür setzt, plötzlich durch das ganze Haus läuft.“", "Rosita sah ihn eisig an. „Uwe. Wenn ich meinen eigenen Stollen essen will, dann esse ich ihn. Am helllichten Tag. Mit einem Messer und einem Teller und einer Tasse Kaffee. Ich muss mich doch nicht nachts in den Keller schleichen und ihn anknabbern wie eine Maus.“", "Das war, das musste selbst Uwe zugeben, ein gutes Argument.", "„Und den Schuhanzieher?“, fragte Susanne. „Du hast gesagt, ohne den kommst du nicht in deine Schuhe und nicht mal in den Garten. Aber heute Nacht bist du sehr wohl aus der Wohnung gekommen.“", "„In Hausschuhen“, sagte Rosita. „Für Hausschuhe braucht man keinen Schuhanzieher. Das weiß doch jedes Kind.“", "„Dann hättest du ja die ganze Zeit durchs Haus gekonnt, Oma“, sagte Elaine sanft.", "Es gab eine sehr lange Pause.", "„Das ist etwas ganz anderes“, sagte Rosita schließlich. Und mehr sagte sie dazu nicht.", "Elaine betrachtete ihre Großmutter über den Bildschirm. Sie sah die verschränkten Arme, das vorgeschobene Kinn, den Blick, der ein bisschen zu fest auf den Tisch gerichtet war. Und sie sah noch etwas: An Rositas Hausschuhen, an den kleinen Bommeln vorne, klebte etwas Weißes. Mehl. Ganz feines, weißes Mehl.", "Als Schiedsrichterin der Familie hatte Elaine eines gelernt: Wenn jemand partout nicht reden wollte, dann hatte er meistens einen Grund, der mit Schuld nichts zu tun hatte. Manchmal hatte man Angst, ausgelacht zu werden. Manchmal wollte man jemanden überraschen. Und manchmal schämte man sich für etwas, das gar nicht schlimm war.", "„Okay, Oma“, sagte sie. „Du musst nichts sagen. Aber ich möchte, dass du weißt: Ich glaube nicht, dass du den Stollen geklaut hast. Wirklich nicht.“", "Rosita sah zum ersten Mal auf. „Wirklich nicht?“", "„Wirklich nicht. Du hättest ihn nicht angeknabbert. Du hättest ihn ordentlich aufgeschnitten.“", "Ein winziges Lächeln huschte über Rositas Gesicht. Dann stand sie auf, nahm ihren Korb, den sie die ganze Zeit neben dem Stuhl stehen gehabt hatte, und ging langsam zur Treppe.", "„Ihr werdet schon sehen“, sagte sie im Gehen. „Am Ende wird sowieso alles schlecht. Aber vielleicht nicht ganz so schlecht, wie ihr denkt.“", "Uwe sah ihr nach. „Was hat sie in dem Korb?“", "„Keine Ahnung“, sagte Susanne. „Er war mit einem Tuch zugedeckt.“", "An der Ermittlungswand blieb der Zettel „Oma?“ hängen. Aber Elaine bat Susanne, das Fragezeichen etwas größer zu machen."], "q": "Was macht Oma nachts in der Betriebsküche? Und was ist in ihrem Korb?"}, {"n": 14, "t": "Staub, überall Staub", "p": ["Es war der neunte Tag ohne Staubsauger.", "Susanne hatte tapfer gekämpft. Sie hatte gefegt, gewischt und gewedelt. Sie hatte mit feuchten Tüchern die Fensterbänke abgerieben und mit einer Fusselrolle das Sofa bearbeitet. Aber gegen den Staub eines alten Hauses kommt man ohne Staubsauger nicht an. Er kam aus den Ritzen der Dielen, er rieselte von den Balken, er sammelte sich in den Ecken und auf den Stufen. Herings Gaststätte war ein Haus mit einer langen Geschichte. Und ein großer Teil dieser Geschichte bestand, wie Susanne jetzt feststellen musste, aus Staub.", "„Ich kann es nicht mehr sehen“, sagte sie am Telefon zu Elaine. „Ich träume schon davon. Heute Nacht habe ich geträumt, ich sauge den ganzen Ort Taura. Von der Kirche bis zum Ortsschild. Es war wunderschön.“", "„Mama, halte durch. Die Lieferung kommt bald.“", "„Das sagst du jeden Tag.“", "Aber dann, ausgerechnet an diesem trüben Morgen, bewies der Staub, dass er auch zu etwas gut war.", "Susanne stand oben im Flur, vor der Abstellkammer, und wollte gerade mit einem Lappen über den Boden wischen, als sie innehielt. Im grauen Staub auf den Dielen waren Abdrücke. Kleine, runde Abdrücke. Sie führten aus der Abstellkammer heraus, den Flur entlang und dann zur Treppe.", "„Uwe!“, rief sie. „Uwe, komm sofort her! Und bring die Lupe mit!“", "Uwe kam mit der Lupe, einem Zollstock und, weil er Uwe war, mit seiner Lesebrille, die farblich perfekt zu seinem Hemd passte. Er kniete sich hin, legte den Zollstock neben einen der Abdrücke und hielt die Lupe darüber.", "„Pfotenabdrücke“, sagte er. „Eindeutig. Vier Zentimeter breit. Vielleicht viereinhalb. Und tief. Sehr tief. Dieses Tier ist schwer.“", "Sie folgten der Spur. Sie führte die Treppe hinunter, Stufe für Stufe. Auf manchen Stufen waren die Abdrücke deutlich zu sehen, auf anderen nur verwischt. Die Schritte lagen eng beieinander, als hätte es das Tier nicht eilig gehabt. Gemütlich. Ohne Hast. Unten im Flur verlor sich die Spur kurz, tauchte dann aber wieder auf: direkt vor der klemmenden Kellertür. Und dort, genau auf der Schwelle, lag ein feiner, weißer Hauch.", "Puderzucker.", "Susanne rief sofort Elaine an und zeigte ihr alles über die Kamera. Elaine hielt ihre eigene Lupe vor den Bildschirm, was ziemlich albern aussah, aber niemand lachte.", "„Papa, miss mal Rockys Pfote.“", "Das war leichter gesagt als getan. Rocky hatte keinerlei Interesse daran, seine Pfote vermessen zu lassen. Er wand sich, er strampelte, er miaute in einer Lautstärke, die vermutlich in ganz Taura zu hören war. Uwe brauchte vier Versuche und am Ende Susannes Hilfe. Aber dann hatte er es.", "„Dreieinhalb Zentimeter“, sagte er und rieb sich einen frischen Kratzer am Handgelenk. „Rocky ist zu klein.“", "„Ein Marder?“, fragte Susanne.", "„Ein großer Marder“, sagte Uwe. „Ein sehr großer, sehr gut genährter Marder. Kein Wunder, bei dem vielen Stollen.“", "Uwe ging in den Keller, um nachzusehen, wie der Marder ins Haus gekommen sein könnte. Er prüfte das kleine Kellerfenster. Es war geschlossen, und in der Ecke des Rahmens hing ein dickes, unberührtes Spinnennetz. Er prüfte die Kohlenluke von früher. Zugeschraubt, seit Jahren. Er prüfte jede Ritze, jede Fuge, jedes Loch in der Wand.", "Als er wieder heraufkam, sah er verwirrt aus. „Es gibt keinen Weg von draußen in den Keller“, sagte er. „Nicht einmal für einen Marder.“", "„Dann wohnt der Marder im Haus?“, fragte Susanne.", "„Dann wohnt der Marder im Haus“, sagte Uwe.", "Elaine sagte eine Weile gar nichts. Dann fragte sie: „Mama, wo liegt eigentlich Bonnie gerade?“", "„Auf dem Sofa. Wie immer. Warum?“", "„Nur so.“", "Susanne sah hinüber. Bonnie lag tatsächlich auf dem Sofa, eingerollt zu einer perfekten, runden Kugel. Sie schlief. Ihr Bauch hob und senkte sich gleichmäßig. Und auf dem Sofa um sie herum lag, wie überall im Haus, eine feine Schicht Staub.", "„Bonnie hat sich seit Tagen nicht bewegt“, sagte Susanne. „Die ist so faul, die steht nicht mal auf, wenn der Napf voll ist. Wenn der Marder ihr über die Nase laufen würde, würde sie nur ein Auge aufmachen.“", "„Bestimmt“, sagte Elaine.", "Aber als sie aufgelegt hatte, nahm sie ihren Notizblock und schrieb etwas auf. Dann strich sie es wieder durch. Dann schrieb sie es wieder hin. Sie war die Ehrlichste in der Familie, und gerade deshalb wollte sie niemanden verdächtigen, bevor sie wirklich sicher war."], "q": "Wem könnten die Pfotenabdrücke gehören? Und was hat Elaine wohl auf ihren Block geschrieben?"}, {"n": 15, "t": "Hinab zum Brunnen", "p": ["„Wir müssen in den Brunnen schauen“, sagte Elaine.", "Uwe und Susanne sahen sich an. Seit Jahren hatte niemand mehr den schweren Holzdeckel abgenommen. Der Brunnen war einfach da, wie ein alter Verwandter, den man respektiert, aber nicht besucht.", "„Alles fängt da unten an“, sagte Elaine. „Das Heulen. Der Stollen. Die Spur endet an der Kellertür. Wenn wir etwas finden, dann dort.“", "Also stiegen sie hinunter. Uwe voran, mit einer großen Taschenlampe aus der Werkstatt, Susanne hinterher, mit dem Handy in der Hand, auf dem Elaine aus Berlin zuschaute. Oder es zumindest versuchte.", "„Ihr seid ganz verpixelt“, sagte Elaine. „Mama, du siehst aus wie ein Mosaik.“", "„Der Keller hat kein Netz“, sagte Uwe. „Das sind dicke alte Bruchsteinmauern. Da kommt nichts durch. Die Leute haben damals gebaut, als müssten sie sich gegen eine Belagerung verteidigen.“", "Unten angekommen, stellten sie sich vor den Brunnen. Er war rund und aus groben, grauen Steinen gemauert, ungefähr hüfthoch. Der Holzdeckel war schwer, aus dicken Eichenbohlen, mit zwei eisernen Griffen. Uwe packte den einen, Susanne den anderen.", "„Auf drei“, sagte Uwe. „Eins, zwei …“", "„… drei …“, sagte Elaine aus dem Handy, mit zwei Sekunden Verzögerung.", "Der Deckel ließ sich schwerer bewegen, als sie gedacht hatten. Es knirschte, es schabte, und dann rutschte er zur Seite. Eine Wolke aus kaltem, feuchtem Geruch stieg aus der Tiefe auf. Uwe leuchtete hinein.", "Die Mauern liefen nach unten, Stein für Stein, immer weiter, bis der Lichtstrahl sich in der Dunkelheit verlor. Ganz tief unten glitzerte etwas. Wasser.", "Uwe nahm einen kleinen Kieselstein vom Boden und ließ ihn fallen. Sie lauschten. Eins. Zwei. Platsch.", "„Ungefähr zwei Sekunden“, sagte Uwe. „Bei freiem Fall rechnet man die halbe Erdbeschleunigung mal die Zeit zum Quadrat. Das sind also knapp zwanzig Meter. Ein ordentlicher Brunnen. Früher hatte so ein Haus seinen eigenen Brunnen, weil man das Wasser für die Küche brauchte, und für die Gäste. Vielleicht sogar fürs Bier.“", "„Papa, woher weißt du das alles?“, fragte Elaine.", "„Allgemeinbildung“, sagte Uwe. „Und ich habe mal eine Dokumentation über Brunnen gesehen. Und eine über Bier.“", "Und genau in diesem Moment geschah etwas, womit niemand gerechnet hatte.", "Rocky, der ihnen offenbar die ganze Zeit unbemerkt gefolgt war, sprang mit einem Satz auf den Brunnenrand. Susanne schrie auf. Uwe ließ beinahe die Taschenlampe fallen. Doch Rocky stand vollkommen sicher auf den Steinen, beugte sich über die Öffnung, sah in die Tiefe hinab und tat, was Rocky immer tat.", "„MAAAUUUU!“", "Der Brunnen nahm das Miauen auf, verschluckte es, verlängerte es, verdrehte es und schickte es zurück. Es kam als ein langgezogenes, hohles, schauriges Heulen zurück, das von allen Wänden widerhallte und sich anhörte, als käme es aus einem tiefen, dunklen Grab.", "„Mauuuuuuu … uuuuu … uuu …“", "Susanne und Uwe sahen sich an. Es war genau das Geräusch. Das Heulen, das Oma in der ersten Nacht gehört hatte, und in der zweiten, und in der dritten.", "„Der Geist!“, sagte Susanne. „Der Geist ist Rocky!“", "„Rocky im Brunnen!“, sagte Uwe. „Physikalisch absolut einleuchtend. Der Schacht ist eine Röhre, das wirkt wie ein Resonanzkörper. Wie bei einer Orgelpfeife.“", "Susanne hob Rocky vorsichtig vom Brunnenrand, und Uwe schob den Deckel wieder zurück. Rocky protestierte lautstark. Er wollte offensichtlich weiter in den Brunnen singen.", "„Elaine, hast du das gehört? Elaine?“", "Auf dem Bildschirm war Elaine eingefroren, mit offenem Mund und erhobener Lupe. Dann ruckelte das Bild, und ihre Stimme kam abgehackt durch.", "„… heißt … nachts immer … Keller … Rocky … nicht allein … läuft … hinterher …“", "„Was? Elaine, wir verstehen dich nicht!“", "„… Rocky läuft jede Nacht … hinterher … Ich glaube, ich weiß, wem …“", "Und dann war die Verbindung weg.", "Susanne und Uwe standen im Halbdunkel des Kellers, neben dem alten Brunnen, und starrten auf den schwarzen Bildschirm. Rocky saß zu ihren Füßen und putzte sich zufrieden das Gesicht.", "„Wem?“, sagte Uwe in die Stille. „Wem läuft Rocky hinterher?“", "Hinter ihnen, irgendwo hinter den alten Bierkisten, raschelte es ganz leise. Aber als Uwe hinleuchtete, war dort nichts. Nur ein schmaler, dunkler Spalt zwischen den Kisten und der Wand, gerade breit genug, dass ein Lichtstrahl nicht hineinreichte."], "q": "Was wollte Elaine sagen? Wem läuft Rocky nachts in den Keller hinterher?"}, {"n": 16, "t": "Der Umschlag im Tresen", "p": ["Oben, mit vollem Netz, rief Elaine sofort zurück.", "„Was wolltest du sagen?“, fragte Susanne atemlos. „Wem läuft Rocky hinterher?“", "Elaine zögerte. „Ich will erst ganz sicher sein“, sagte sie. „Wenn ich jetzt jemanden beschuldige und es stimmt nicht, dann ist das unfair. Gebt mir noch ein paar Tage.“", "Uwe war enttäuscht. Susanne auch. Aber sie kannten Elaine. Sie war ehrlich, manchmal unbequem ehrlich, aber sie verurteilte niemanden vorschnell. Deshalb war sie ja die Schiedsrichterin.", "Also wandte sich Uwe einer anderen Aufgabe zu. Weihnachten rückte näher, und Heiligabend wollte die Familie, wie jedes Jahr, in der alten Gaststube feiern. Mit dem großen Baum neben dem Stammtisch, mit Kerzen auf dem Tresen und mit allem, was dazugehört. Und Uwe hatte beschlossen, dass der Tresen in diesem Jahr glänzen sollte wie nie zuvor.", "„Da ist eine Leiste locker“, sagte er. „Unter der alten Zapfanlage. Die stört mich schon seit Jahren.“", "Genauer gesagt störte sie ihn seit ungefähr zwanzig Jahren. Aber jetzt hatte er Zeit. Er kniete sich hinter den Tresen, setzte einen Schraubenzieher an und hebelte vorsichtig. Die Leiste löste sich mit einem leisen Knacken. Dahinter war ein Hohlraum, nicht größer als ein Schuhkarton.", "Und in diesem Hohlraum, mit einem alten, vergilbten Klebestreifen an das Holz geklebt, war ein Umschlag.", "„Susanne“, sagte Uwe leise. „Komm mal her.“", "Der Umschlag war dick und braun geworden vom Alter. Darauf stand, in einer runden, sorgfältigen Handschrift, mit blauem Kugelschreiber: „Für meinen Nachfolger.“", "Susanne erkannte die Schrift sofort. Sie musste sich setzen.", "„Wir holen Mutti“, sagte sie.", "Rosita kam die Treppe herunter, diesmal am helllichten Tag und ohne Korb. Sie setzte sich an den Stammtisch, und Uwe legte ihr den Umschlag vor. Elaine war per Video dabei, das Handy lehnte an der Kerzenschale.", "Rosita sah den Umschlag lange an, ohne ihn zu berühren. Dann strich sie mit dem Finger ganz sanft über die Schrift.", "„Das ist von Ulli“, sagte sie. „So hat er seine Fs geschrieben. Mit dem kleinen Haken. Das hat er bei der Polizei so gelernt, damit man sie nicht mit einem T verwechselt.“", "Niemand sagte etwas. In der Gaststube war es so still, dass man das Ticken der alten Wanduhr hörte.", "„Mach du ihn auf“, sagte Rosita schließlich und schob den Umschlag zu Elaine hin. Genauer gesagt: zum Handy. „Er ist für den Nachfolger. Und du bist hier die Ermittlerin.“", "Susanne öffnete ihn für Elaine und hielt den Inhalt vor die Kamera. Darin war eine Karteikarte, wie man sie früher auf Polizeiwachen benutzt hatte. Und ein kleiner Messingschlüssel, nicht länger als ein Finger, an einem roten Faden.", "Auf der Karte stand ein Gedicht.", "„Wo kein Gast ein Bier bestellt,\nwo’s kühl ist, still und ohne Geld,\nwo Wasser schläft seit alter Zeit,\nda liegt mein Fall für dich bereit.\nSteh an der Kurbel, zähl hinab:\nDer dritte Stein, der gibt was ab.“", "Darunter, etwas kleiner: „Akte B. Gelöst, aber nicht vergessen. U. H.“", "„Akte B.“, flüsterte Susanne. „B wie …“", "„Broilerbeine“, sagte Rosita. Ihre Stimme klang ganz anders als sonst. Weicher. „Das ist sein Notizbuch. Er hat es versteckt. Und er hat einen Hinweis dagelassen, falls es jemand finden will.“", "„Aber warum im Tresen?“, fragte Uwe.", "„Weil er da immer stand“, sagte Rosita. „Er hat immer gesagt, hinter dem Tresen erfährt man mehr als auf jeder Polizeiwache.“", "Elaine las das Gedicht noch einmal laut vor. Dann noch einmal. Ihr Herz klopfte.", "„Er wusste, dass es irgendwann jemand findet“, sagte sie. „Er hat es für uns gemacht.“", "Rosita nickte. Dann stand sie auf, ein bisschen schneller, als sie sonst aufstand, und sagte, sie müsse nach ihrem Topflappen sehen. Susanne wollte ihr nachgehen, aber Uwe hielt sie sanft am Arm zurück.", "„Lass sie“, sagte er. „Manchmal braucht man einen Moment für sich.“", "Auf der Ermittlungswand hing jetzt, ganz in der Mitte, die Karteikarte. Uwe hatte sie nicht laminiert. Zum ersten Mal in seinem Leben hatte er etwas an die Wand gehängt, ohne die Wasserwaage zu benutzen."], "q": "Löst das Rätsel! Wo hat Opa Ulli seine Akte versteckt?"}, {"n": 17, "t": "Die Kurbel", "p": ["„Kühl, still, ohne Geld, wo kein Gast ein Bier bestellt“, murmelte Uwe. Er lief in der Gaststube auf und ab, die Hände hinter dem Rücken verschränkt, wie ein Professor kurz vor einer großen Entdeckung. „Das ist eindeutig nicht die Gaststube. Hier haben alle Gäste ein Bier bestellt. Das ist nicht die Küche, die ist warm. Und Wasser, das seit alter Zeit schläft …“", "„Der Brunnen“, sagten Susanne und Elaine gleichzeitig.", "„Der Brunnen“, sagte Uwe. „Natürlich. Ulli hat sein Notizbuch im Brunnen versteckt. Nicht im Wasser, sondern in der Mauer. Steh an der Kurbel, zähl hinab: Der dritte Stein. Er meint die Steine der Brunnenmauer. Wenn man an der Kurbel steht und von oben nach unten zählt, ist der dritte Stein lose. Dahinter liegt die Akte.“", "„Dann los!“, sagte Susanne.", "Aber Uwe blieb stehen. Sein Gesicht wurde plötzlich sehr blass.", "„Uwe? Was ist?“", "„Die Kurbel“, sagte er. „Die Kurbel ist nicht mehr da.“", "Früher hatte der Brunnen eine Kurbel gehabt, eine alte eiserne Winde, mit der man den Eimer an einem Seil herunterlassen und wieder heraufziehen konnte. Sie war an einem Holzgestell befestigt gewesen, das über dem Brunnen stand. Und vor vielen Jahren, als der Brunnen längst nicht mehr benutzt wurde, hatte Uwe dieses Gestell abgebaut.", "„Ich habe daraus eine Lampe gemacht“, sagte er leise.", "„Eine Lampe?“", "„Die Lampe auf der Holzterrasse. Die mit dem schmiedeeisernen Griff. Das ist die Kurbel. Ich fand, sie hatte so eine schöne Patina. Es war eine sehr gelungene Lampe.“", "Susanne ging hinaus in den Garten. Tatsächlich: Am Rand der Holzterrasse stand die Lampe. Ein Pfosten aus altem Holz, daran eine Laterne und an der Seite, als dekoratives Element, eine eiserne Kurbel mit hölzernem Griff. Sie hatte sie hundertmal gesehen und nie darüber nachgedacht.", "„Dann wissen wir nicht, wo die Kurbel stand“, sagte Elaine. „Der Brunnen ist rund. Man kann überall anfangen zu zählen. Wenn wir nicht wissen, auf welcher Seite die Kurbel war, müssten wir alle Steine einzeln prüfen. Das sind Dutzende.“", "„Ich weiß noch, wie das Gestell aussah“, sagte Uwe. „Aber nicht mehr, wie es stand. Das ist so lange
