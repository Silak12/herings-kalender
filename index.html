 her.“", "Es war ein großer Moment für Susanne. Denn wenn jemand in dieser Familie wusste, wie etwas früher ausgesehen hatte, dann sie.", "Sie holte den Karton aus dem Lagerraum, den mit den alten Zeitungsausschnitten und Fotos. Sie breitete alles auf dem Stammtisch aus. Speisekarten, Postkarten, Eintrittskarten vom Kegelverein. Und dann, ganz unten, fand sie ein Foto, das sie beim ersten Mal übersehen hatte.", "Es zeigte den Keller. Es war ein Schwarz-Weiß-Foto, an den Rändern gewellt, aber man konnte alles erkennen: den Brunnen, das hölzerne Gestell und die eiserne Kurbel daran. Und daneben stand Ulli, in Hemdsärmeln, einen vollen Eimer in der Hand, und lachte in die Kamera.", "„Die Kurbel war auf der Seite zur hinteren Wand“, sagte Susanne. „Da, wo heute die Bierkisten stehen.“", "Uwe beugte sich über das Foto. „Du hast recht. Die Kisten stehen genau davor. Seit Jahren. Bis unter die Decke gestapelt.“", "„Dann müssen wir die Kisten wegräumen“, sagte Susanne.", "„Nein“, sagte Elaine. „Wartet. Bitte.“", "„Warum?“", "Elaine zögerte. „Opa hat ‚Für meinen Nachfolger‘ geschrieben. Ich weiß, das klingt komisch. Aber ich möchte dabei sein, wenn wir es finden. Richtig dabei, nicht über einen Bildschirm, der im Keller sowieso ständig einfriert. In ein paar Tagen bin ich bei euch. Wartet bis dahin. Bitte.“", "Uwe und Susanne sahen sich an. Dann nickten beide.", "Und dann kam von der Treppe her eine Stimme. Oma Rosita stand dort, auf der untersten Stufe, eine Hand am Geländer. Niemand hatte sie herunterkommen hören.", "„Und ohne mich macht ihr das auch nicht“, sagte sie.", "Alle drehten sich um.", "„Mutti“, sagte Susanne. „Das ist im Keller.“", "„Ich weiß, wo das ist“, sagte Rosita. „Ich wohne seit Jahrzehnten in diesem Haus.“ Sie sah zu dem Foto auf dem Stammtisch. Ulli mit dem Eimer, lachend. „Wenn Ulli da unten etwas versteckt hat, dann will ich dabei sein. Und wenn ich mir dabei den Tod hole.“", "„Du holst dir nicht den Tod, Oma“, sagte Elaine.", "„Das weiß man nie“, sagte Rosita. Aber sie lächelte dabei."], "q": "Was ist hinter dem dritten Stein? Und was öffnet wohl der kleine Messingschlüssel?"}, {"n": 18, "t": "Die Stille", "p": ["Diese Geschichte handelt von jemandem, von dem bisher kaum die Rede war. Deshalb erzählen wir sie heute aus ihrer Sicht. Ihren Namen verraten wir nicht. Noch nicht.", "Sie war nie eine Freundin vieler Worte gewesen. Andere redeten. Sie schwieg. Sie hatte schon früh festgestellt, dass man durch Schweigen mehr bekommt als durch Lärm. Wer leise ist, den übersieht man. Und wen man übersieht, der kann tun, was er will.", "Sie mochte es warm. Sie mochte es weich. Sie mochte Ruhe, und sie mochte Essen, am liebsten beides zusammen. Sie war nicht mehr die Jüngste, und sie hatte keine Lust mehr auf Hektik. Treppen fand sie anstrengend, Springen fand sie überflüssig, und Eile fand sie würdelos.", "Es gab in diesem Haus vieles, was sie mochte. Die warme Stelle vor dem Ofen. Den Geruch von Butter. Das Sofa, wenn die Sonne am Nachmittag darauf schien. Aber es gab auch eine Sache, die sie aus tiefster Seele verabscheute.", "Das Ungeheuer.", "Jeden Morgen um halb acht kam es aus seiner Kammer. Es brüllte. Es fauchte. Es fraß alles, was auf dem Boden lag, und es kroch in jede Ecke, unter jeden Schrank, unter jedes Sofa, sogar dorthin, wo sie sich verstecken wollte. Es gab keinen sicheren Ort vor dem Ungeheuer. Kein Morgen ohne das Gebrüll.", "Bis sie herausfand, was das Ungeheuer brauchte, um zu brüllen.", "Es war ganz einfach. Es brauchte diese weichen, dicken Papiertüten, die in der Kammer im Regal lagen. Ohne Tüten kein Brüllen. Und so hatte sie die Tüten genommen. Eine nach der anderen, das ganze Paket. Es hatte mehrere Nächte gedauert, und es war anstrengend gewesen. Aber seitdem war es still. Herrlich still. Jeden Morgen um halb acht. Sie konnte endlich ausschlafen.", "Und die Tüten waren auch noch weich. Sie lagen jetzt an ihrem geheimen Ort und waren ein ganz wunderbares Bett.", "Ihr geheimer Ort. Ja, den hatte sie auch. Tief unten, wo es kühl war und still. Wo niemand hinkam, weil alle Angst hatten. Hinter den alten, hohen Kisten, in einer kleinen Nische in der Mauer, gerade groß genug für jemanden wie sie. Dort hatte sie alles, was sie brauchte. Die Tüten zum Liegen. Und gleich daneben, auf dem Regal, das herrlichste Ding, das sie je gerochen hatte.", "Es war in ein weiches Tuch gewickelt, und es roch nach Butter und Zucker und nach etwas Fruchtigem, Fernem. Sie hatte es in der ersten Nacht entdeckt, nur ein kleines Stück. Dann noch eins. Sie war vorsichtig. Sie nahm nie zu viel auf einmal. Wer leise ist und nicht gierig, den erwischt man nicht.", "Das einzige Problem war die Nische. Sie lag etwas zu hoch. Früher, in ihrer Jugend, wäre sie mit einem Satz hinaufgekommen. Aber das war lange her, und in letzter Zeit war sie, nun ja, etwas stattlicher geworden. Springen kam nicht infrage.", "Also hatte sie nachgedacht. Und sie hatte sich an diesen langen, glatten Stab erinnert, der oben neben der Tür an einem Haken hing. Er war leicht genug, um ihn zu tragen. Sie hatte ihn heruntergeholt, Stufe für Stufe, die ganze lange Treppe hinab. Jetzt lehnte er an der Mauer, schräg, wie eine kleine Rampe. Sie musste nur noch gemütlich hinaufspazieren. Ein wunderbares Gefühl.", "Natürlich gab es auch Ärger. Der Junge folgte ihr überallhin. Das tat er, seit er auf der Welt war. Er war laut wie eine Blaskapelle und hatte keinerlei Sinn für Heimlichkeit. Jede Nacht lief er ihr hinterher in die Tiefe, sprang auf den runden Rand des Lochs in der Ecke und brüllte hinein, nur um zu hören, wie das Loch zurückbrüllte. Sie hatte es aufgegeben, ihn zu erziehen.", "Aber eigentlich, so dachte sie, war das gar nicht schlecht. Wenn oben jemand das Brüllen hörte, dann dachte er an Geister. Oder an den Jungen. Niemand dachte an sie.", "Niemand dachte jemals an sie.", "Und dann war da der Mann, der in der Kiste feststeckte. Das war die aufregendste Nacht gewesen. Er hatte dort im Dunkeln gekniet, ganz still, und sie war an ihm vorbeigegangen, so dicht, dass sie sein Bein gestreift hatte. Er hatte nicht gewusst, dass sie es war. Sie hatte ihr Stückchen genommen, ganz in Ruhe, und war wieder gegangen. Sie war sehr zufrieden mit sich gewesen.", "Aber in letzter Zeit wurde es unruhig im Haus. Es wurde getuschelt. Es wurden Fäden gespannt. Und die Jüngste der Familie, die aus der Ferne, die man nur als Gesicht in diesem flachen, leuchtenden Kasten kannte, schaute sie neuerdings so merkwürdig an. Durch eine große Glasscheibe mit einem Holzgriff.", "Sie machte sich keine Sorgen. Sie war immer davongekommen.", "Aber sie beschloss, vorsichtig zu sein."], "q": "Wer ist „sie“? Welche Hinweise habt ihr in dieser Geschichte entdeckt?"}, {"n": 19, "t": "Rockys Ausflug", "p": ["Es geschah am Nachmittag, als niemand damit rechnete.", "Susanne hatte gerade Plätzchen aus dem Ofen geholt. Vanillekipferl, die Lieblingssorte von Elaine, die in wenigen Tagen ankommen würde. Uwe stand daneben und begutachtete jedes einzelne Kipferl mit kritischem Blick. „Dieses hier ist nicht ganz symmetrisch“, sagte er. „Das sollte ich vorsorglich entsorgen.“ Und dann aß er es.", "In diesem Moment schoss Rocky durch die Küche. Er hatte etwas entdeckt, irgendetwas, das nur er sehen konnte, vermutlich einen Staubkrümel oder einen Lichtreflex oder einfach die bloße Möglichkeit, irgendwo hinzurennen. Er raste durch die Gaststube, schlitterte über die Dielen, bog im Flur ab und verschwand durch den Spalt der klemmenden Kellertür.", "„Rocky!“, rief Susanne. „Nicht in den Keller!“", "Aber Rocky war schon weg. Und von unten hörte man ein triumphierendes, hallendes „MAAAUUUU“.", "Uwe seufzte, griff zur Taschenlampe und ging hinterher. Susanne folgte ihm, ein Vanillekipferl noch in der Hand.", "Der Keller war dunkel und still. Der Brunnendeckel lag an seinem Platz. Auf dem Regal lag, was vom Stollen übrig war, inzwischen nicht mehr viel. Von Rocky keine Spur.", "„Rocky?“", "Ein Rascheln. Hinten, hinter den alten Bierkisten.", "Uwe leuchtete in die Richtung. Da war wieder dieser schmale Spalt, zwischen dem Turm aus Kisten und der Kellerwand. Und aus diesem Spalt kam, rückwärts, Stück für Stück, ein Katzenschwanz zum Vorschein. Dann ein Katzenhinterteil. Dann der ganze Rocky.", "Er zog etwas hinter sich her. Etwas Großes, Papiernes.", "„Das ist ein Staubsaugerbeutel“, flüsterte Susanne. „Das ist ein ganzer Staubsaugerbeutel. Neu. Unbenutzt.“", "Sie riss ihn Rocky fast aus dem Maul und drückte ihn an die Brust, als hätte sie ein verloren geglaubtes Kind wiedergefunden. Rocky protestierte. Er hatte den Beutel schließlich gefunden.", "Uwe kniete sich hin und leuchtete in den Spalt. Der Lichtstrahl drang nur ein kleines Stück weit hinein. Aber weit genug.", "„Susanne“, sagte er. „Da hinten ist noch mehr.“", "Im Licht der Taschenlampe glänzte etwas. Ein Griff. Ein Griff aus Messing, an einem langen, dunklen Holzstab. Er lehnte schräg an der Mauer.", "„Omas Schuhanzieher“, sagte Susanne.", "Und daneben, nur halb zu erkennen, ein Stapel. Weiß, papieren, ordentlich übereinanderliegend. Darauf, wie ein feiner Schneefall, Puderzucker. Und ganz am Rand, zusammengeknüllt, ein Stück Küchentuch. Das Tuch, in das der Stollen am ersten Tag gewickelt worden war.", "„Das ist ein Versteck“, sagte Uwe. „Das ist das Versteck des Diebes.“", "Susanne wollte sofort die Kisten zur Seite räumen. Uwe auch. Er hatte die Hand schon an der obersten Kiste. Aber dann hielten beide inne.", "„Wir haben Elaine versprochen, zu warten“, sagte Susanne.", "„Wir haben versprochen, mit Ullis Versteck zu warten“, sagte Uwe. „Das hier ist das Versteck des Diebes.“", "„Uwe. Das ist dieselbe Stelle. Die Kurbel war auf genau dieser Seite. Das hast du doch auf dem Foto selbst gesehen.“", "Uwe ließ die Kiste los. Sie hatte recht. Der Dieb hatte sein Versteck genau dort eingerichtet, wo Ulli sein Geheimnis verborgen hatte. Ob das Zufall war?", "Sie riefen Elaine an, sobald sie wieder oben waren.", "„Ihr habt das Versteck gefunden?“, fragte Elaine aufgeregt. „Und den Dieb?“", "„Nur das Versteck. Den Schuhanzieher, die Staubsaugerbeutel und das Tuch vom Stollen. Aber keinen Dieb. Und wir haben nichts angefasst. Fast nichts.“ Susanne hielt den geretteten Staubsaugerbeutel in die Kamera.", "Elaine schwieg einen Moment. Dann sagte sie: „Gut. Sehr gut. Lasst alles genau so, wie es ist. Wenn wir jetzt alles wegräumen, merkt der Dieb, dass wir ihm auf der Spur sind. Dann kommt er nie wieder. Und dann erwischen wir ihn nie.“", "„Was hast du vor?“", "„Wenn ich da bin, machen wir eine Nachtwache. Alle zusammen. Wir warten im Keller, bis der Dieb zurückkommt. Und dann haben wir ihn auf frischer Tat.“", "„Und wenn es ein Marder ist?“, fragte Uwe. „Ein großer, gefährlicher, sehr gut genährter Marder?“", "„Papa“, sagte Elaine geduldig. „Hast du schon mal einen Marder gesehen, der einen Schuhanzieher als Rampe benutzt?“", "Uwe öffnete den Mund. Dann schloss er ihn wieder. Daran hatte er nicht gedacht. Der Schuhanzieher lehnte schräg an der Mauer, genau unter einer Stelle, an die man ohne Hilfe schlecht herankam. Wie eine kleine Rutsche. Oder wie eine Treppe für jemanden, der nicht gern sprang.", "„Wer zu faul ist, um zu springen“, sagte Elaine langsam, „der baut sich eine Rampe.“", "An diesem Abend, als Susanne den Fernseher ausschaltete, sah sie zu Bonnie hinüber. Bonnie lag auf dem Sofa, wie immer, rund wie eine Kugel. Und für einen Moment, nur einen ganz kleinen Moment, hatte Susanne das Gefühl, dass Bonnie sie beobachtete.", "Dann schüttelte sie den Kopf. Bonnie doch nicht. Bonnie schaffte es ja kaum vom Sofa bis zum Napf."], "q": "Wer ist zu faul zum Springen und braucht deshalb eine Rampe?"}, {"n": 20, "t": "Was im Korb war", "p": ["Es klopfte an der Tür der Wohnung. Ganz leise. Susanne öffnete. Draußen stand Oma Rosita, mit ihrem Korb.", "„Komm mal mit hoch“, sagte sie. „Und bring Uwe mit. Und ruf Elaine an.“", "Es war das erste Mal seit Jahren, dass Rosita jemanden in ihre Wohnung bat, ohne dass es um einen tropfenden Wasserhahn oder einen kaputten Fernseher ging. Susanne und Uwe folgten ihr die Treppe hinauf. Uwe hielt das Handy, auf dem Elaine aus Berlin zugeschaltet war.", "Rositas Wohnung roch wie immer: nach Kaffee, Lavendel und frisch gewaschener Wolle. Auf jedem freien Platz lagen Topflappen, Deckchen und halbfertige Häkelarbeiten. Rosita setzte sich in ihren Sessel, stellte den Korb vor sich auf den Tisch und zog langsam das Tuch weg.", "Darunter lag, in ein Küchentuch gewickelt, ein Stollen.", "Ein großer, schwerer, wunderschöner Stollen, dick mit Puderzucker bestäubt.", "„Mutti“, sagte Susanne. „Was ist das?“", "„Was soll das schon sein“, sagte Rosita. „Ein Stollen.“", "„Aber woher?“", "Rosita sah auf ihre Hände. „Als der erste weg war, da habe ich gedacht: Jetzt ist Weihnachten kaputt. So wie ich es immer gesagt habe. Und dann habe ich gedacht: Nein. Nicht dieses Jahr. Und dann bin ich runtergegangen. Nachts, damit es keiner merkt.“", "„Warum nachts?“, fragte Elaine.", "„Weil ihr sonst wieder gesagt hättet, ich soll mich schonen. Und weil ich nicht wusste, ob er was wird. Wenn er nichts geworden wäre, hätte ich ihn weggeschmissen, und keiner hätte es erfahren.“ Sie zuckte mit den Schultern. „Und die Betriebsküche hat den großen Ofen. In meinem kleinen Ofen hier oben wird so ein Stollen nicht richtig. Das weiß man doch.“", "Uwe trat einen Schritt näher an den Korb. Er atmete tief ein. Er schloss die Augen.", "„Uwe“, sagte Rosita scharf.", "„Ich rieche nur“, sagte Uwe. „Ich schwöre es.“", "„Ich habe ihn im Kleiderschrank versteckt“, fuhr Rosita fort. „Ganz hinten, hinter den Wintermänteln. Da kommt keiner hin. Kein Uwe, kein Marder und kein Geist.“", "Susanne musste lachen, und gleichzeitig hatte sie Tränen in den Augen. Sie setzte sich auf die Lehne von Rositas Sessel und legte ihr den Arm um die Schultern.", "„Er hat nicht lang genug geruht“, sagte Rosita. „Nicht mal zwei Wochen. Der wird bestimmt nichts. Der schmeckt bestimmt nach gar nichts.“", "„Mutti, der wird wunderbar.“", "„Das sagst du nur so.“", "Elaine meldete sich vom Handy. „Oma? Darf ich dich noch etwas fragen?“", "„Frag.“", "„Als du nachts in der Betriebsküche warst. War das wirklich nur wegen des Stollens?“", "Rosita schwieg lange. Dann sagte sie leise: „Nein. Nicht nur.“", "Sie sah zum Fenster hinaus, hinunter in den Garten, wo Uwes Lampe mit der alten Kurbel auf der Terrasse stand.", "„In dieser Küche haben Ulli und ich dreißig Jahre lang zusammen gestanden. Er hat die Broiler gemacht, ich die Klöße. Er hat immer gepfiffen beim Kochen, ganz falsch, und ich hab ihm gesagt, er soll aufhören, und er hat dann extra lauter gepfiffen. Wenn ich da unten bin, dann ist das, als wäre er noch da.“", "Niemand sagte etwas.", "„Und den Keller“, fuhr Rosita fort, „den Keller mochte er am liebsten. Er ist immer runtergegangen, wenn er nachdenken musste. Zum Brunnen. Er hat gesagt: Da unten ist es so still, da hört man seine eigenen Gedanken. Und einmal, da hat er zu mir gesagt: Rosi, wenn du mal was suchst, das ich dir nicht sagen konnte, dann guck am Brunnen.“", "„Und hast du je nachgeschaut?“, fragte Susanne.", "Rosita schüttelte den Kopf. „Ich hatte immer Angst. Vor dem Keller. Vor dem Brunnen. Vor dem, was ich vielleicht finde. Oder was ich vielleicht nicht finde. Deshalb gehe ich da nicht runter. Nicht, weil es da unten kalt ist.“", "Jetzt verstand Susanne, warum ihre Mutter seit Jahren den Keller mied. Es war nicht die Feuchtigkeit und auch nicht die steile Treppe. Es war die Angst, Ulli dort unten zu vermissen.", "„Oma“, sagte Elaine. „Bald bin ich da. Dann gehen wir zusammen runter. Ich halte deine Hand. Versprochen.“", "Rosita nickte. Dann packte sie den Stollen wieder sorgfältig in das Tuch und stellte den Korb zurück in den Kleiderschrank, ganz nach hinten, hinter die Wintermäntel.", "„Und jetzt raus hier“, sagte sie. „Ich muss häkeln. Die Topflappen werden sonst nicht fertig. Und dann habt ihr an Weihnachten wieder nichts.“"], "q": "Was meinte Opa Ulli wohl mit „was ich dir nicht sagen konnte“?"}, {"n": 21, "t": "Die Ermittlerin kombiniert", "p": ["In Berlin stand Elaine vor ihrem offenen Koffer und überlegte, was eine Ermittlerin für Weihnachten in Taura einpacken musste. Warme Socken. Die Geschenke. Die Lupe. Ihren Notizblock, der inzwischen fast voll war. Und, nach kurzem Zögern, eine Stirnlampe. Man wusste ja nie, was in einem Keller mit Brunnen auf einen wartete.", "Morgen würde sie fahren. Aber vorher, das spürte sie, musste sie noch etwas erledigen.", "Sie rief ihre Mutter per Video an. Susanne nahm sofort ab. Im Hintergrund sah man die Gaststube, den Tresen und die Ermittlungswand, an der Uwe inzwischen sogar eine kleine Beleuchtung angebracht hatte.", "„Morgen kommst du!“, rief Susanne. „Ich habe schon dein Bett bezogen. Und Vanillekipferl gebacken. Und …“", "In diesem Moment klingelte es an der Haustür. Susanne eilte hin, das Handy noch in der Hand, sodass Elaine nur noch die Flurdecke sah, ein Stück Lampe und dann, kurz, das Gesicht eines Paketboten.", "„Ein Paket für Sie.“", "Dann hörte Elaine ein Geräusch, das sie von ihrer Mutter noch nie gehört hatte. Eine Art Jubelschrei, halb Lachen, halb Schluchzen.", "„Sie sind da! Elaine, sie sind da! Die Staubsaugerbeutel!“", "Das Bild wackelte wild, als Susanne zur Abstellkammer rannte. Elaine sah den Staubsauger. Sie sah, wie ihre Mutter mit zitternden Fingern einen Beutel einsetzte. Sie sah ihren Finger über dem Schalter …", "„Mama, stopp!“", "Susanne erstarrte.", "„Nicht saugen. Noch nicht. Bitte. Nur noch zwei Tage.“", "„Elaine! Es sind fast drei Wochen!“", "„Ich weiß. Aber wenn du jetzt saugst, weiß der Dieb, dass seine Ruhe vorbei ist. Dann versteckt er sich, und wir erwischen ihn nie. Morgen Nacht machen wir die Nachtwache. Danach darfst du saugen, so viel du willst. Das ganze Haus. Ganz Taura, wenn du magst.“", "Susanne sah auf den Staubsauger. Dann aufs Handy. Dann wieder auf den Staubsauger. Es war vermutlich der schwerste Moment ihres Lebens. Aber sie stellte ihn ab.", "„Bis übermorgen“, sagte sie. „Keine Minute länger.“", "„Danke, Mama. Und jetzt stell mich bitte an die Ermittlungswand. Und hol Papa dazu.“", "Susanne lehnte das Handy an den Zapfhahn, sodass Elaine alles sehen konnte: die laminierten Zettel, die gespannten Fäden, den Hausplan, Opas Foto und die Karteikarte mit dem Gedicht. Uwe kam aus der Werkstatt, in einem dunkelblauen Pullover von Hilfiger, an dem trotz Werkstatt nicht ein einziger Sägespan klebte.", "Elaine nahm ihren Notizblock und ging die Hinweise einen nach dem anderen durch. Laut und langsam, damit alle mitkamen.", "„Der Täter ist leise. Niemand hat ihn je gehört. Er ist schwer, die Pfotenabdrücke sind tief und viereinhalb Zentimeter breit. Er ist rund, das hat Papa im Dunkeln gespürt. Er geht gemütlich, mit kleinen Schritten. Er liebt Butter und Stollen. Er hasst den Staubsauger so sehr, dass er die Beutel versteckt hat. Er ist zu bequem zum Springen und hat sich deshalb eine Rampe gebaut. Er hat sein Versteck tief unten, hinter den Bierkisten. Er hat also einen Grund, tagsüber zu schlafen. Und Rocky läuft ihm jede Nacht hinterher.“", "Sie ließ den Block sinken.", "„Und es gibt nur einen im ganzen Haus, dem Rocky immer hinterherläuft. Schon sein ganzes Leben lang.“", "Es war ganz still in der Gaststube. Langsam drehte Susanne das Handy um, sodass die Kamera in den Raum zeigte. Und alle sahen auf dieselbe Stelle.", "Auf dem Sofa, in der Ecke, lag Bonnie. Sie lag dort, wie sie immer lag, rund wie eine Kugel. Aber sie schlief nicht. Sie hatte beide Augen offen und sah direkt in die Kamera des Handys.", "Ein paar Sekunden lang sahen die beiden sich an. Die Ermittlerin in Berlin und die Katze in Taura.", "Dann stand Bonnie auf. Ganz langsam. Sie streckte sich. Und dann, zum ersten Mal seit Wochen, verließ sie das Sofa am helllichten Tag und ging, ohne ein Geräusch, mit kleinen, gemütlichen Schritten aus dem Raum.", "„Die ist beleidigt“, flüsterte Uwe.", "„Die ist ertappt“, sagte Elaine. „Aber Vermutungen reichen nicht. Morgen bin ich da. Und dann beweisen wir es.“"], "q": "Hat Elaine recht? Oder tut sie Bonnie unrecht?"}, {"n": 22, "t": "Die Nachtwache", "p": ["Der Zug aus Berlin hatte zwanzig Minuten Verspätung. Uwe nutzte die Zeit, um auf dem Bahnsteig in Chemnitz dreimal seinen Schal neu zu binden. Er trug seinen kamelfarbenen Wintermantel von Boss, Lederhandschuhe und einen Kaschmirschal und sah aus, als würde er nicht seine Tochter abholen, sondern eine Agentin vom britischen Geheimdienst.", "„Willkommen, Frau Kommissarin“, sagte er, als Elaine ausstieg, und umarmte sie so fest, dass ihr fast die Lupe aus der Jackentasche fiel.", "In Taura stand Susanne schon in der Tür und drückte ihr ein Päckchen in die Hand, bevor sie überhaupt den Koffer abgestellt hatte. Darin war ein dunkelroter Schal mit kleinen weißen Lupen. „Ermittlerinnenschal“, sagte Susanne stolz. Und oben an der Treppe stand Oma Rosita, sah Elaine von oben bis unten an und sagte: „Du bist dünn geworden. Komm hoch, ich hab Suppe gemacht.“", "Es war genau so, wie Weihnachten in Taura immer war. Nur Bonnie ließ sich den ganzen Tag nicht blicken.", "Der Plan für die Nacht war einfach. Um elf Uhr würden sie in den Keller gehen, das Licht ausmachen und sich hinter dem Regal und der Werkbank verstecken, mit Blick auf die Bierkisten und den Spalt. Die Kellertür würde einen Spalt offen bleiben, wie immer. Niemand würde reden. Und wenn der Dieb kam, würde Elaine das Licht anschalten.", "Uwe kleidete sich wie James Bond auf Nachtmission: schwarzer Rollkragenpullover von Boss, schwarze Hose, schwarze Lederhandschuhe. Dazu packte er Proviant ein: belegte Brote, Vanillekipferl, eine Thermoskanne Kaffee und, zur Sicherheit, eine Knackwurst.", "Susanne nahm eine Decke mit und, das ließ sie sich nicht ausreden, den Staubsauger. „Falls der Täter flüchten will“, sagte sie. „Dann schalte ich ihn ein.“", "„Mama, da unten gibt es keine Steckdose.“", "„Der Täter weiß das aber nicht.“", "Und dann kam der Moment, mit dem niemand gerechnet hatte. Um Viertel vor elf kam Oma Rosita die Treppe herunter, in ihrem dicksten Wintermantel, mit Mütze und Häkelkorb.", "„Ich komme mit“, sagte sie. „Ich habe gesagt, ich komme mit. Und was ich sage, mache ich auch.“", "Elaine nahm ihre Hand, so wie sie es versprochen hatte. Gemeinsam stiegen sie die Kellertreppe hinab, Stufe für Stufe. Auf der letzten Stufe blieb Rosita stehen und sah sich um. Zum ersten Mal seit vielen, vielen Jahren.", "„Hier ist ja gar nichts“, sagte sie schließlich, fast ein bisschen enttäuscht. „Ich hatte mir das viel schlimmer vorgestellt.“", "Sie richteten sich ein, Uwe und Susanne hinter der Werkbank, Elaine und Rosita hinter dem Regal auf zwei Klappstühlen. Dann machte Elaine das Licht aus. Und sie warteten.", "Es wurde Mitternacht. Rosita häkelte im Dunkeln, nach Gefühl. „Das wird sowieso nichts“, flüsterte sie. „Da ist eine Masche falsch. Ich spür’s.“", "Es wurde eins. Uwe aß die Vanillekipferl. Alle.", "„Papa“, flüsterte Elaine. „Das waren meine.“", "„Das war taktisch notwendig“, flüsterte Uwe zurück. „Das Rascheln der Tüte hätte uns verraten.“", "Um Viertel nach eins kam Rocky mit lautem Getrappel die Treppe herunter, sprang auf den Brunnenrand und sang in die Tiefe. „MAAAUUUU!“ Der Brunnen heulte zurück. Rosita griff nach Elaines Hand. Dann verschwand Rocky irgendwo in der Dunkelheit.", "Und dann wurde es ganz still. So still, dass man das Tropfen tief unten im Brunnen hörte. So still, dass Elaine ihr eigenes Herz schlagen hörte.", "In dieser Stille spürte sie es mehr, als dass sie es hörte. Ein Hauch von Bewegung auf der Treppe. Etwas Weiches, das sich durch den Türspalt schob. Kein Tapsen. Kein Atmen. Kein Laut.", "Etwas bewegte sich durch den Keller, langsam, gemütlich, ohne Eile. Am Brunnen vorbei. Zum Regal. Dann ein leises Rascheln. Stoff. Das Küchentuch.", "Elaines Finger lag auf dem Lichtschalter. Sie zählte bis drei. Dann drückte sie.", "Das Licht der nackten Glühbirne flammte auf. Alle blinzelten. Und vor ihnen, mitten auf dem schrägen Schuhanzieher, halb auf dem Weg nach oben in die Nische hinter den Bierkisten, erstarrte eine runde Gestalt.", "Zwei Augen blickten sie an. Sehr ruhig. Sehr gelassen. Und ganz und gar nicht schuldbewusst."], "q": "Wem gehören die Augen? Morgen erfahrt ihr es."}, {"n": 23, "t": "Die Täterin", "p": ["Es war Bonnie.", "Natürlich war es Bonnie.", "Sie saß mitten auf dem Schuhanzieher, der schräg an der Kellerwand lehnte, rund und schwer und vollkommen gelassen. An ihren Schnurrhaaren klebte Puderzucker. An ihrem Kinn hing ein winziger Krümel Zitronat. Und sie sah die versammelte Familie an mit dem Blick einer Königin, die von ihren Untertanen beim Frühstück gestört wird.", "„Bonnie“, flüsterte Susanne. „Unsere Bonnie.“", "Bonnie blinzelte einmal langsam. Dann drehte sie sich um und setzte ihren Weg fort. Gemütlich, ohne Eile, Pfote für Pfote, die Rampe hinauf, bis in die kleine Nische in der Mauer hinter den Bierkisten. Dort drehte sie sich zweimal um sich selbst und legte sich hin. Auf einen Stapel weißer, weicher, unbenutzter Staubsaugerbeutel.", "„Meine Beutel“, sagte Susanne. „Sie schläft auf meinen Beuteln.“", "„Das“, sagte Uwe, und seine Stimme bebte, „ist unglaublich. Das ist die eleganteste Rampe, die ich je gesehen habe. Und ich habe schon viele Rampen gesehen.“", "Elaine trat vor. Sie war die Schiedsrichterin. Sie war die Ermittlerin. Und jetzt war es Zeit, den Fall aufzulösen.", "„Bonnie“, sagte sie feierlich. „Du bist überführt. Und ich erkläre euch, wie sie es gemacht hat.“", "Sie zählte es an den Fingern ab.", "„Erstens: das Motiv. Bonnie liebt Essen und hasst Lärm. Der Stollen roch nach Butter, also hat sie jede Nacht ein kleines Stück davon genascht. Nie zu viel, damit es nicht auffällt. Deshalb ist sie in den letzten Wochen auch runder geworden. Das war kein Winterfell, Mama. Das war Stollen.“", "Susanne sah Bonnie an. Bonnie sah zurück und leckte sich zufrieden das Maul.", "„Zweitens: die Staubsaugerbeutel. Bonnie hasst den Staubsauger. Ohne Beutel kein Saugen. Ohne Saugen Ruhe. Und weich sind sie auch. Ein Bett und ein Sieg zugleich.“", "„Drittens: der Schuhanzieher. Die Nische ist zu hoch. Und Bonnie springt nicht. Also hat sie sich den langen Schuhanzieher von Omas Haken geholt und als Rampe benutzt. Der Täter war nicht zu klein. Er war zu bequem.“", "„Viertens: das Heulen. Jede Nacht ist Rocky seiner Mutter hinterhergelaufen. Das macht er schon sein ganzes Leben. Und weil Rocky Rocky ist, ist er auf den Brunnen gesprungen und hat hineingeschrien. Er hat Lärm gemacht, und alle haben an Geister gedacht. Oder an Rocky. Aber niemand an Bonnie. Rocky war, ohne es zu wissen, die perfekte Ablenkung.“", "„Fünftens: das Alibi. Bonnie lag tagsüber immer auf dem Sofa und hat geschlafen. Jeder hat sie gesehen. Deshalb hat niemand an sie gedacht. Aber sie hat nicht geschlafen, weil sie faul ist. Sie hat geschlafen, weil sie nachts gearbeitet hat.“", "„Und sechstens“, sagte Elaine, „und das ist das Wichtigste: Bonnie miaut nie. Sie macht kein Geräusch. Niemals. Und in einem Haus, in dem alles knarrt und Oma jedes Geräusch hört, kann nur jemand unbemerkt bleiben, der wirklich, wirklich still ist.“", "Es war einen Moment lang ganz ruhig im Keller.", "Dann fing Oma Rosita an zu lachen. Erst leise, dann immer lauter. Sie lachte, bis ihr die Tränen kamen, und sie musste sich an Elaines Arm festhalten.", "„Die Katze“, japste sie. „Die ganze Zeit die Katze. Und ich dachte, es sind Geister.“", "Dann drehte sie sich zu Uwe um und wurde plötzlich ernst. „Uwe“, sagte sie. „Ich habe dich verdächtigt. Ich habe mich geirrt. Das kommt sehr selten vor. Ich entschuldige mich.“", "Uwe richtete sich auf. „Entschuldigung angenommen“, sagte er. „Unter einer Bedingung.“", "„Welcher?“", "„Ich bekomme morgen das erste Stück Stollen.“", "Rosita überlegte. „Das zweite“, sagte sie. „Das erste bekommt Elaine.“", "Uwe nickte. Es war ein fairer Kompromiss.", "Vorsichtig räumten sie die oberen Bierkisten zur Seite. Uwe holte den Schuhanzieher von der Wand, wischte den Puderzucker ab und reichte ihn Rosita. Sie nahm ihn in beide Hände und hielt ihn einen Moment lang fest an die Brust gedrückt.", "„Der hat Ulli gehört“, sagte sie. „Na ja. Er hat ihn mir geschenkt. Aber eigentlich gehört er uns beiden.“", "Susanne sammelte ihre Staubsaugerbeutel ein. Neun Stück, einer davon mit einer angeknabberten Ecke. Bonnie protestierte nicht. Sie stand nur auf, ging gemächlich zu Rocky, der inzwischen wieder aufgetaucht war, und legte sich neben ihn auf eine Decke.", "Und dann bemerkte Elaine etwas.", "Die Nische, in der Bonnie gelegen hatte, war keine richtige Nische. Es war ein altes, rechteckiges Loch in der Mauer, genau auf der Höhe, auf der früher das Holzgestell mit der Kurbel befestigt gewesen war. Darunter begann der gemauerte Rand des Brunnens.", "„Steh an der Kurbel, zähl hinab“, flüsterte sie.", "Sie zählte. Erster Stein. Zweiter Stein. Dritter Stein.", "Der dritte Stein, direkt unter Bonnies Schlafplatz, war heller als die anderen. Und an seinem Rand war kein Mörtel.", "„Bonnie hat die ganze Zeit darauf geschlafen“, sagte Elaine. „Sie hat Opas Versteck bewacht.“", "Alle sahen auf den Stein. Uwe hatte den Schraubenzieher schon in der Hand. Aber Rosita legte ihm die Hand auf den Arm.", "„Morgen“, sagte sie. „Ulli hat immer gesagt: Die schönen Sachen macht man an Heiligabend.“"], "q": "Was liegt hinter dem dritten Stein? Morgen ist Heiligabend."}, {"n": 24, "t": "Akte B.", "p": ["Am Morgen des Heiligabends stand die ganze Familie wieder im Keller. Diesmal mit Licht, diesmal ohne Angst. Oma Rosita war als Erste die Treppe hinuntergegangen, ganz allein, und hatte unten auf die anderen gewartet.", "„Ich bin ja jetzt sowieso schon mal hier gewesen“, sagte sie.", "Elaine kniete sich vor den Brunnen. Sie legte die Finger an den dritten Stein und zog vorsichtig. Er bewegte sich. Erst ein wenig, dann mehr, und dann löste er sich aus der Mauer und lag schwer in ihren Händen.", "Dahinter war ein Hohlraum. Und darin stand eine kleine Blechdose, wie man sie früher für Bonbons hatte. Rot, mit einem verblassten Muster aus Tannenzweigen, und vorne dran ein winziges Schloss.", "Elaine nahm den kleinen Messingschlüssel aus der Tasche, den sie seit Tagen bei sich trug. Sie gab ihn Rosita.", "„Du“, sagte sie. „Du sollst sie aufmachen.“", "Oben in der Gaststube leuchtete der Weihnachtsbaum, und auf dem Tisch duftete Rositas zweiter Stollen.", "Rosita setzte sich auf Ullis alten Platz am Stammtisch. Sie steckte den Schlüssel ins Schloss. Er passte. Es klickte.", "In der Dose lag ein kleines Notizbuch mit schwarzem Einband. Auf dem Deckel stand, in der runden Handschrift mit den Fs mit dem kleinen Haken: „Akte B.“", "Und darunter, zwischen Notizbuch und Dosenboden, lag ein Foto.", "Rosita reichte Elaine das Notizbuch. „Lies vor“, sagte sie. „Du bist die Nachfolgerin.“", "Elaine schlug es auf und las.", "„Samstag. Broilertag. 24 Beine in den Ofen. 22 Beine auf den Tellern. Zwei fehlen. Ich beginne mit den Ermittlungen.“", "„Samstag. Wieder zwei Beine weg. Rosi hat ein Alibi, sie stand die ganze Zeit neben mir an den Klößen. Die Mädchen helfen heute beim Abwasch. Eine von beiden hilft auffällig gern.“", "„Samstag. Verdächtige S. war ‚zufällig‘ um 18 Uhr in der Nähe der Küche. Sie sagt, sie wollte nur mal gucken. Sie hatte Soße am Kinn.“", "Alle drehten sich langsam zu Susanne um.", "„Ich war das nicht!“, rief Susanne und hob beide Hände. „Ich schwöre es!“", "Elaine las weiter.", "„Samstag. Ich habe mich hinter dem Kühlschrank versteckt. 18 Uhr 04: Die Verdächtige S. betritt die Küche. Sie sieht sich um. Sie nimmt ein Broilerbein. Sie riecht daran. Sie schließt die Augen. Sie isst es mit einem Gesichtsausdruck, wie ich ihn sonst nur in der Kirche sehe. Dann nimmt sie noch eins. Sie hat ihre Schwester dafür extra zum Kartoffelschälen in den Hof geschickt. Fall gelöst.“", "Susanne starrte auf das Notizbuch. Dann klappte ihr der Mund auf.", "„Zum Kartoffelschälen in den Hof“, sagte sie langsam. „Das war ich! Ich musste samstags immer Kartoffeln schälen, und sie hat in der Küche ‚geholfen‘. S. bin nicht ich. S. ist Sylvia!“", "„Tante Sylvia?“, rief Elaine.", "„Meine eigene Schwester!“ Susanne fing an zu lachen, so sehr, dass sie sich am Stammtisch festhalten musste. „Und ich dachte jahrelang, sie kriegt immer die besten Stücke, weil sie Papas Liebling ist!“", "Uwe lehnte sich zufrieden zurück. „Ich möchte nur festhalten“, sagte er, „dass ich in dieser Familie offenbar der Einzige bin, der nie etwas geklaut hat.“", "„Papa, du warst damals noch gar nicht da.“", "„Eben“, sagte Uwe. „Ein lupenreines Alibi.“", "Dann kam der letzte Eintrag, in besonders sorgfältiger Schrift.", "„Abschlussbericht. Ich verzichte auf eine Festnahme. Wer ein Broilerbein mit so viel Liebe isst, ist kein Verbrecher. Der gehört an unseren Tisch. Ab sofort bekommt S. jeden Samstag zwei Beine extra, auf einem eigenen Teller. Dann muss er nicht mehr klauen, und ich muss nicht mehr hinter dem Kühlschrank sitzen.", "Für meinen Nachfolger: Wenn du das hier liest, dann hast du einen Fall gelöst. Herzlichen Glückwunsch. Denk daran: Ein guter Ermittler hört zu. Er urteilt nicht zu schnell. Er weiß, dass hinter fast jeder Tat ein Grund steckt, und dass die meisten Gründe gar nicht so schlimm sind. Und er weiß, wann man einen Fall lieber mit einem vollen Teller abschließt als mit Handschellen.", "Pass gut auf die Familie auf. U. H.“", "Elaine legte das Notizbuch langsam auf den Tisch. Niemand sagte etwas. Susanne wischte sich über die Augen. Uwe räusperte sich und sah sehr angestrengt an die Decke.", "„Er hat es gewusst“, sagte Susanne leise. „Die ganze Zeit. Und Sylvia trotzdem jeden Samstag zwei Beine extra hingestellt. Ich dachte immer, das wäre Zufall.“", "„Bei Ulli war nichts Zufall“, sagte Rosita. „Und Lieblinge hatte er zwei.“", "„Das erzähle ich Sylvia“, sagte Susanne, noch immer ein bisschen gerührt. „Gleich morgen früh. Sie wird rot werden bis unter die Haare.“", "Dann nahm sie das Foto aus der Dose und legte es in die Mitte des Stammtischs, damit alle es sehen konnten.", "Es zeigte genau diesen Stammtisch, voll besetzt, mit lachenden Gesichtern. In der Mitte Ulli, mit Schürze, den Arm um Rosita gelegt, die über irgendetwas lachte, das jemand gerade gesagt haben musste. Und ganz am Rand, fast aus dem Bild gerutscht, ein junges Mädchen, das frech in die Kamera grinste. Mit einem Broilerbein in der Hand.", "„Sylvia“, sagte Susanne und lachte. „Auf frischer Tat.“", "Auf der Rückseite stand nur: „Die Familie. Alle an einem Tisch.“", "Rosita sah das Foto lange an. Dann schnitt sie ein Stück Stollen ab, ein großes, ordentliches Stück, und legte es Elaine auf den Teller. Dann ein zweites für Uwe.", "„Der hat nicht lang genug geruht“, sagte sie. „Der schmeckt bestimmt nach nichts.“", "Elaine biss hinein. Er schmeckte nach Butter, nach Zitronat, nach Rosinen. Er schmeckte nach Weihnachten in Taura.", "„Oma“, sagte sie. „Das ist der beste Stollen, den du je gebacken hast.“", "Und Oma Rosita, die sonst bei jedem Lob widersprach, sagte diesmal einfach nur: „Ich weiß.“", "Auf dem Sofa öffnete Bonnie ein Auge, als sie den Stollen roch. Dann schloss sie es wieder. Sie hatte ihren Teil bereits gehabt.", "Und unter dem Baum, ganz laut und ganz zufrieden, sagte Rocky: „Mau.“", "Fall abgeschlossen. Frohe Weihnachten."], "q": "Die letzte Frage geht an euch alle: Wer von euch hatte Bonnie schon im Verdacht, und seit welchem Türchen?"}];
const YEAR = 2026;
const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
let seen = store.get('hg-seen', []);
let cheat = store.get('hg-cheat', []);
let fs = store.get('hg-fs', 0);
const applyFs = () => document.documentElement.style.setProperty('--fs', (17 + fs * 2) + 'px');
applyFs();

function dayToday(){
  const d = new Date();
  if (d.getFullYear() > YEAR) return 99;
  if (d.getFullYear() < YEAR || d.getMonth() < 11) return 0;
  return d.getDate();
}
const isOpen = n => n <= dayToday() || cheat.includes(n);
const fmtWords = c => Math.max(3, Math.round(c.p.join(' ').split(/\s+/).length / 170));

function gableSvg(n){
  return `<svg viewBox="0 0 420 170" role="img" aria-label="Türchen ${n}">
    <path d="M20 120 L210 14 L400 120 Z" fill="#3a2a22"/>
    <path d="M20 120 L210 14 L400 120 L390 128 L210 26 L30 128 Z" fill="#f3f6f7"/>
    <rect x="40" y="120" width="340" height="50" fill="#c9b79c"/>
    <rect x="150" y="56" width="120" height="70" rx="6" fill="#ffd77a"/>
    <rect x="150" y="56" width="120" height="70" rx="6" fill="none" stroke="#6b4a2e" stroke-width="6"/>
    <text x="210" y="110" text-anchor="middle" font-family="Alegreya Sans,sans-serif" font-weight="800" font-size="54" fill="#5a3b25">${n}</text>
    <rect x="60" y="134" width="300" height="30" rx="3" fill="#24170f"/>
    <text x="210" y="155" text-anchor="middle" font-family="UnifrakturMaguntia,serif" font-size="19" fill="#f0c45a">Herings Gaststätte</text>
  </svg>`;
}

function renderHome(){
  document.getElementById('snow').style.opacity = 1;
  const t = dayToday();
  app.innerHTML = `
  <section class="band hero">
    <h1>Der Spuk von Herings Gaststätte</h1>
    <p>Ein Weihnachtskrimi in 24 Türchen. Für Susanne, Uwe, Oma Rosita, Bonnie und Rocky.</p>
    <svg class="house" viewBox="0 0 640 300" role="img" aria-label="Herings Gaststätte bei Nacht im Schnee"><use href="#haus"/></svg>
  </section>
  <section class="band" style="padding-top:12px">
    <div class="grid">${K.map(c => {
      const o = isOpen(c.n), s = seen.includes(c.n);
      return `<a class="win${o ? ' open' : ''}${s ? ' seen' : ''}${c.n === t ? ' today' : ''}" href="#tuer-${c.n}" aria-label="Türchen ${c.n}${o ? '' : ', noch geschlossen'}"><span>${c.n}</span></a>`;
    }).join('')}</div>
    <p class="foot">Jeden Tag ein Kapitel, etwa fünf Minuten zum Lesen. Am Ende jedes Kapitels wartet eine Ermittlerfrage.</p>
  </section>`;
}

function renderLocked(c){
  document.getElementById('snow').style.opacity = 1;
  const t = dayToday();
  const days = t === 0 ? null : c.n - t;
  app.innerHTML = `
  <section class="band gable">${gableSvg(c.n)}</section>
  <section class="band lock"><div class="wrap">
    <div class="big">Halt!</div>
    <p>Dieses Türchen öffnet sich erst am ${c.n}. Dezember${days ? `, also in ${days} ${days === 1 ? 'Tag' : 'Tagen'}` : ''}. Opa Ulli hätte gesagt: Ein guter Ermittler hat Geduld.</p>
    <div class="nav" style="justify-content:center">
      <a class="btn" href="#start">Zum Kalender</a>
      <button class="btn" id="cheat" type="button">Ich schummle trotzdem</button>
    </div>
  </div></section>`;
  document.getElementById('cheat').addEventListener('click', () => {
    if (!cheat.includes(c.n)) cheat.push(c.n);
    store.set('hg-cheat', cheat);
    renderChapter(c);
  });
}

function renderChapter(c){
  document.getElementById('snow').style.opacity = .25;
  if (!seen.includes(c.n)){ seen.push(c.n); store.set('hg-seen', seen); }
  const paras = c.p.map(p => p.includes('\n')
    ? `<p class="verse">${esc(p)}</p>`
    : `<p>${esc(p)}</p>`).join('');
  const prev = c.n > 1 ? `<a class="btn" href="#tuer-${c.n - 1}">‹ Türchen ${c.n - 1}</a>` : `<a class="btn" href="#start">Zum Kalender</a>`;
  const next = c.n < 24 ? (isOpen(c.n + 1) ? `<a class="btn gold" href="#tuer-${c.n + 1}">Türchen ${c.n + 1} ›</a>` : `<a class="btn" href="#start">Zum Kalender</a>`) : `<a class="btn gold" href="#start">Frohe Weihnachten</a>`;
  app.innerHTML = `
  <section class="band gable">${gableSvg(c.n)}</section>
  <article class="band chap" style="padding-top:8px"><div class="wrap">
    <p class="kicker lbl">Türchen ${c.n} · ${c.n}. Dezember</p>
    <h2>${esc(c.t)}</h2>
    <p class="meta">Etwa ${fmtWords(c)} Minuten Lesezeit</p>
    <div class="tools"><button class="btn" id="fsm" type="button" aria-label="Schrift kleiner">A−</button><button class="btn" id="fsp" type="button" aria-label="Schrift größer">A+</button></div>
    <div class="text" style="margin-top:22px">${paras}</div>
    <div class="q"><b class="lbl">Ermittlerfrage</b><p>${esc(c.q)}</p></div>
    <nav class="nav">${prev}${next}</nav>
  </div></article>`;
  document.getElementById('fsp').addEventListener('click', () => { fs = Math.min(4, fs + 1); store.set('hg-fs', fs); applyFs(); });
  document.getElementById('fsm').addEventListener('click', () => { fs = Math.max(0, fs - 1); store.set('hg-fs', fs); applyFs(); });
}

function route(){
  const m = /^#tuer-(\d{1,2})$/.exec(location.hash);
  const c = m && K.find(x => x.n === +m[1]);
  if (c){ isOpen(c.n) ? renderChapter(c) : renderLocked(c); }
  else renderHome();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
route();

/* Puderzucker-Schnee */
const cv = document.getElementById('snow'), cx = cv.getContext('2d');
let W = 0, H = 0, flakes = [];
const size = () => { W = cv.width = innerWidth; H = cv.height = innerHeight; flakes = Array.from({length: Math.round(W / 14)}, () => ({x: Math.random() * W, y: Math.random() * H, r: Math.random() * 2 + .6, s: Math.random() * .5 + .2})); };
const ro = new ResizeObserver(size); ro.observe(document.body);
size();
const tick = () => {
  cx.clearRect(0, 0, W, H); cx.fillStyle = 'rgba(255,255,255,.55)';
  for (const f of flakes){ f.y += f.s; f.x += Math.sin(f.y / 40) * .2; if (f.y > H) { f.y = -4; f.x = Math.random() * W; } cx.beginPath(); cx.arc(f.x, f.y, f.r, 0, 7); cx.fill(); }
  requestAnimationFrame(tick);
};
if (!matchMedia('(prefers-reduced-motion: reduce)').matches) tick();
}
</script>
</body>
</html>
